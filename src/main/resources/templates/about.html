<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/styleabout.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
</head>

<body>
<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="about-content">
        <h1 class="about-title" th:text="${title}"></h1>

        <p class="text-center mb-4" style="color: #6c757d; font-size: 1.1rem;">
            <i class="bi bi-info-circle"></i> Информация о проекте и команде
        </p>

        <!-- Блок 1: О проекте Biranaku -->
        <div class="content-block">
            <h3><i class="bi bi-rocket-takeoff"></i> О проекте Biranaku</h3>
            <p>
                <strong>Biranaku</strong> — это бесплатная доска объявлений, созданная для удобного поиска
                товаров, услуг, работы и сотрудников. Мы объединяем людей и помогаем им достигать своих целей
                быстро, просто и безопасно.
            </p>
            <p>
                Наша миссия — сделать процесс поиска и предложения максимально прозрачным и доступным для каждого.
                Мы постоянно развиваем платформу, добавляем новые функции и улучшаем пользовательский опыт.
            </p>

            <div class="row mt-4">
                <div class="col-md-4">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="bi bi-box-seam" style="font-size: 2rem; color: #0d6efd;"></i>
                            <h5 class="card-title mt-2">Товары</h5>
                            <p class="card-text">Продажа и покупка любых товаров</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="bi bi-tools" style="font-size: 2rem; color: #198754;"></i>
                            <h5 class="card-title mt-2">Услуги</h5>
                            <p class="card-text">Поиск исполнителей и предложение услуг</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center h-100">
                        <div class="card-body">
                            <i class="bi bi-briefcase" style="font-size: 2rem; color: #fd7e14;"></i>
                            <h5 class="card-title mt-2">Работа</h5>
                            <p class="card-text">Вакансии и резюме для соискателей</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блок 2: Наши ценности -->
        <div class="content-block">
            <h3><i class="bi bi-gem"></i> Наши ценности</h3>
            <div class="row">
                <div class="col-md-6">
                    <ul class="list-unstyled">
                        <li><i class="bi bi-check-circle-fill text-success"></i> <strong>Прозрачность</strong> — честные условия и открытая модерация</li>
                        <li><i class="bi bi-check-circle-fill text-success"></i> <strong>Безопасность</strong> — защита данных и чёрные списки нарушителей</li>
                        <li><i class="bi bi-check-circle-fill text-success"></i> <strong>Доступность</strong> — полная бесплатность для всех пользователей</li>
                    </ul>
                </div>
                <div class="col-md-6">
                    <ul class="list-unstyled">
                        <li><i class="bi bi-check-circle-fill text-success"></i> <strong>Надёжность</strong> — система блокировок и логирование всех действий</li>
                        <li><i class="bi bi-check-circle-fill text-success"></i> <strong>Развитие</strong> — мы постоянно улучшаем сервис</li>
                        <li><i class="bi bi-check-circle-fill text-success"></i> <strong>Открытость</strong> — мы всегда на связи через поддержку</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Блок 3: Правила и безопасность -->
        <div class="content-block">
            <h3><i class="bi bi-shield-check"></i> Правила и безопасность</h3>
            <p>
                Для обеспечения безопасности и порядка на платформе мы внедрили систему модерации и блокировок.
                Все пользователи обязаны соблюдать <a href="/confiden_agr/agreement" target="_blank">Пользовательское соглашение</a>
                и <a href="/confiden_agr/confidential" target="_blank">Политику конфиденциальности</a>.
            </p>
            <div class="row mt-3">
                <div class="col-md-6">
                    <div class="card border-warning">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-exclamation-triangle text-warning"></i> Запрещено</h5>
                            <ul>
                                <li>Наркотики, оружие, экстремизм</li>
                                <li>Интим-услуги и финансовые пирамиды</li>
                                <li>Контрафакт и мошенничество</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card border-success">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-shield-plus text-success"></i> Мы защищаем</h5>
                            <ul>
                                <li>Лестничная блокировка: 1→3→5→30 дней</li>
                                <li>Чёрный список телефонов</li>
                                <li>Журнал всех действий модерации</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <p class="mt-3 text-muted small">
                <i class="bi bi-info-circle"></i> Подробнее о правилах читайте в
                <a href="/confiden_agr/agreement" target="_blank">Пользовательском соглашении</a>.
            </p>
        </div>

        <!-- Продвижение, тарифы и оплата -->
        <div class="content-block">
            <h3><i class="bi bi-megaphone"></i> Продвижение объявлений на biranaku.ru</h3>
            <p>
                <strong>biranaku.ru</strong> — это современная и удобная площадка для размещения объявлений.
                Мы помогаем продавцам и покупателям быстро находить друг друга. Чтобы ваш товар, услуга или вакансия продавались ещё быстрее,
                мы разработали эффективные инструменты продвижения.
            </p>
            <p>
                Проект работает официально. Оплата принимается на карту самозанятого лица,
                а каждый пользователь после платежа гарантированно получает официальный электронный чек
                Федеральной налоговой службы (ФНС России).
            </p>

            <h5 class="mt-4"><i class="bi bi-tags"></i> Тарифы на продвижение объявлений</h5>
            <p class="text-muted small">
                Все объявления проходят обязательную предварительную модерацию.
                Вы платите только после того, как ваше объявление одобрено и уже опубликовано на сайте!
            </p>

            <div class="row mt-3">
                <div class="col-md-6">
                    <div class="card h-100 border-primary">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-highlighter text-primary"></i> Тариф «Первый» (Лента)</h5>
                            <h6 class="card-subtitle mb-2 text-muted">300 рублей</h6>
                            <p class="card-text">
                                Ваше объявление выделяется визуально в общей ленте.
                                Оно привлекает до 3 раз больше внимания покупателей и не теряется среди других предложений.
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card h-100 border-success">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-stars text-success"></i> Тариф «Второй» (Лента + Карусель)</h5>
                            <h6 class="card-subtitle mb-2 text-muted">600 рублей</h6>
                            <p class="card-text">
                                Самый эффективный способ продаж. Помимо выделения в общей ленте,
                                ваше объявление попадает в главную рекламную карусель на стартовой странице сайта.
                                Его увидит каждый первый посетитель biranaku.ru!
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <h5 class="mt-4"><i class="bi bi-play-circle"></i> Как активировать платные функции (Инструкция)</h5>
            <ol class="list-group list-group-numbered mt-2">
                <li class="list-group-item d-flex justify-content-between align-items-start">
                    <div class="ms-2 me-auto">
                        <div class="fw-bold">Дождитесь модерации</div>
                        Разместите объявление на сайте. Как только оно пройдёт проверку, оно опубликуется.
                    </div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-start">
                    <div class="ms-2 me-auto">
                        <div class="fw-bold">Переведите оплату</div>
                        Перечислите сумму выбранного тарифа (300 или 600 рублей) на карту Сбербанка по номеру:<br />
                        <span class="badge bg-light text-dark fs-6 p-2 mt-1">
                            <i class="bi bi-credit-card"></i> 2202 2092 9993 1336
                        </span>
                    </div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-start">
                    <div class="ms-2 me-auto">
                        <div class="fw-bold">Укажите комментарий</div>
                        В комментарии к платежу внутри вашего банковского приложения обязательно укажите
                        <strong>автора объявления, категорию и название</strong>
                        (например: «Юзер47, вакансия, оператор линии»).
                    </div>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-start">
                    <div class="ms-2 me-auto">
                        <div class="fw-bold">Активация</div>
                        После получения перевода в течение часа у объявления появятся платные функции,
                        а на ваш email придёт официальный электронный чек.
                    </div>
                </li>
            </ol>
            <p class="mt-3 text-muted small">
                <i class="bi bi-info-circle"></i> Если у вас возникли вопросы по оплате или активации —
                обратитесь в нашу поддержку.
            </p>
        </div>

        <!-- Блок 4: Контакты -->
        <div class="content-block">
            <h3><i class="bi bi-envelope-at"></i> Контакты</h3>
            <div class="row">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-headset"></i> Поддержка</h5>
                            <p class="card-text">
                                По вопросам работы сайта, модерации, блокировок, техническим проблемам и оплаты
                                вы можете обратиться через страницу <strong>«Поддержка»</strong>,
                                по почте <strong>biranaku-connection@yandex.ru</strong>
                                или по телефону <strong>+7 (994) 843-36-44</strong>.
                            </p>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title"><i class="bi bi-envelope-paper"></i> Юридические обращения</h5>
                            <p class="card-text">
                                Для юридически значимых запросов, вопросов по персональным данным
                                и предложений о сотрудничестве:<br />
                                <strong><i class="bi bi-envelope"></i> biranaku-connection@yandex.ru</strong>
                            </p>
                            <p class="card-text text-muted small mt-2">
                                <i class="bi bi-person-badge"></i> Владелец: Самозанятый (плательщик НПД)
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Блок 5: Команда / Разработка -->
        <div class="content-block">
            <h3><i class="bi bi-people"></i> О команде</h3>
            <p>
                Над проектом <strong>Biranaku</strong> работает команда энтузиастов, объединённых общей целью —
                создать лучшую площадку для объявлений в рунете. Мы любим своё дело и ценим каждого пользователя.
            </p>
            <p class="text-muted small">
                <i class="bi bi-calendar3"></i> Версия сайта: 1.0 | Редакция документов: 16.07.2026
            </p>
        </div>

    </div>
</div>

<footer th:insert="~{block/footer :: footerhtml}"></footer>

<script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
