
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Технические работы - 503</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
        .error-code { font-size: clamp(5rem, 15vw, 8rem); font-weight: bold; color: #ffc107; margin-bottom: 0; line-height: 1.1; }
        .error-title { font-size: clamp(1.5rem, 5vw, 2rem); margin-bottom: 1rem; color: #343a40; font-weight: 600; }
        .error-message { font-size: clamp(1rem, 4vw, 1.2rem); color: #6c757d; margin-bottom: 2rem; max-width: 500px; margin-left: auto; margin-right: auto; padding: 0 1rem; }
        .maintenance-icon { font-size: 4rem; color: #ffc107; margin-bottom: 2rem; }
        .progress { height: 10px; border-radius: 1rem; max-width: 300px; margin: 1rem auto; }
        .progress-bar { background-color: #ffc107; }
        .container { width: 100%; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 768px) { .error-container { padding: 1rem; } .maintenance-icon { font-size: 3rem; } }
    </style>
</head>
<body>
<div class="error-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="maintenance-icon"><i class="fas fa-tools"></i></div>
                <h1 class="error-code" th:text="${errorCode}">503</h1>
                <h2 class="error-title" th:text="${errorTitle}">Технические работы</h2>
                <p class="error-message" th:text="${errorMessage}">В настоящее время ведутся технические работы. Пожалуйста, попробуйте позже.</p>
                <div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div></div>
                <div class="mt-4"><p class="text-muted">Мы работаем над улучшением сервиса. Обычно работы занимают не более 30 минут.</p></div>
            </div>
        </div>
    </div>
</div>
<script type="text/javascript" src="/js/all.min.js"></script>
</body>
</html>
