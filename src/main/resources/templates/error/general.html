
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ошибка</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    .error-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .error-card { background: white; border-radius: 1.5rem; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
    .error-icon { font-size: 4rem; color: #dc3545; margin-bottom: 1rem; }
    h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); color: #343a40; margin-bottom: 1rem; }
    .error-message { font-size: 1.1rem; color: #6c757d; margin-bottom: 2rem; }
    .btn-primary { background-color: #0d6efd; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; color: white; display: inline-block; transition: 0.2s; }
    .btn-primary:hover { background-color: #0b5ed7; transform: translateY(-2px); }
    @media (max-width: 768px) { .error-card { padding: 1.5rem; margin: 1rem; } }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-card">
    <div class="error-icon">⚠️</div>
    <h1>Произошла ошибка</h1>
    <p class="error-message" th:text="${message}">Сообщение об ошибке</p>
    <a href="/" class="btn-primary" style="padding: 0.75rem 1.5rem; border-radius: 0.5rem;">Вернуться на главную</a>
  </div>
</div>
</body>
</html>
