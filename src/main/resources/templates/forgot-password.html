<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/stylelogin.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
</head>
<body>
<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="login-form">
        <h2 class="form-title">Восстановление пароля</h2>

        <p class="text-center mb-4" style="color: #6c757d;">Введите ваш email для получения кода восстановления</p>

        <!-- Сообщение об ошибке -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Сообщение об успехе -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle"></i>
            <span th:text="${success}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">Отправить код</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}">Вернуться к входу</a>
        </div>
    </div>
</div>
<footer th:insert="~{block/footer :: footerhtml}"></footer>
<script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
