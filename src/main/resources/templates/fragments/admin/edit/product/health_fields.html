<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="healthFields(el)">
    <div id="healthFieldsEdit" class="filter-group mb-4" th:attr="data-category=${el.category}">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-heartbeat me-2"></i>Здоровье и красота
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 mb-3 filter-group">
                        <label class="form-label">Вид <span class="text-danger">*</span></label>
                        <select id="healthKind" name="healthKind" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('health','health','healthKind')}"
                                    th:if="${option.key != ''}"
                                    th:value="${option.key}"
                                    th:text="${option.value}"
                                    th:selected="${el.healthKind != null and el.healthKind == option.key}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3 filter-group">
                        <label class="form-label">Тип <span class="text-danger">*</span></label>
                        <select id="healthType" name="healthType" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('health','health','healthType')}"
                                    th:if="${option.key != ''}"
                                    th:value="${option.key}"
                                    th:text="${option.value}"
                                    th:selected="${el.healthType != null and el.healthType == option.key}"></option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3 filter-group">
                        <label class="form-label">Пол <span class="text-danger">*</span></label>
                        <select id="genderHealth" name="genderHealth" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('health','health','genderHealth')}"
                                    th:if="${option.key != ''}"
                                    th:value="${option.key}"
                                    th:text="${option.value}"
                                    th:selected="${el.genderHealth != null and el.genderHealth == option.key}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
