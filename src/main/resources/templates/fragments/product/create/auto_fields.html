<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="autoFields">
    <div id="autoFields" class="filter-group mb-4" style="display: none;">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-car me-2"></i>Автозапчасти и автотовары
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Тип <span class="text-danger">*</span></label>
                        <select id="autoType" name="autoType" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('auto', 'auto', 'autoType')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Состояние <span class="text-danger">*</span></label>
                        <select id="conditionAuto" name="conditionAuto" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('auto', 'auto', 'conditionAuto')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
