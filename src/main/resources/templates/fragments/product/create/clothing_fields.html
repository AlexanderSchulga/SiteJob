<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="clothingFields">
    <div id="clothingFields" class="filter-group mb-4" style="display: none;">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-car me-2"></i>Одежда и обувь
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Тип <span class="text-danger">*</span></label>
                        <select id="clothingType" name="clothingType" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('clothing', 'clothing', 'clothingType')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Пол <span class="text-danger">*</span></label>
                        <select id="genderClothing" name="genderClothing" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('clothing', 'clothing', 'genderClothing')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Состояние <span class="text-danger">*</span></label>
                        <select id="conditionClothing" name="conditionClothing" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('clothing', 'clothing', 'conditionClothing')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
