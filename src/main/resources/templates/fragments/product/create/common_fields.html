<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- ===== НАЗВАНИЕ ===== -->
<div th:fragment="title">
    <div class="mb-4">
        <label for="title" class="form-label">
            <i class="fas fa-heading me-1 text-muted"></i>Название товара <span class="text-danger">*</span>
        </label>
        <input type="text" id="title" name="title"
               placeholder="Введите название товара"
               class="form-control" required>
    </div>
</div>

<!-- ===== ЦЕНА ===== -->
<div th:fragment="price">
    <div class="mb-4">
        <label for="price" class="form-label">
            <i class="fas fa-ruble-sign me-1 text-muted"></i>Укажите цену <span class="text-danger">*</span>
        </label>
        <div class="input-group">
            <span class="input-group-text">₽</span>
            <input type="number"
                   id="price"
                   name="price"
                   placeholder="Укажите цену (от 0 до 999 999 999)"
                   class="form-control"
                   required
                   min="0"
                   max="999999999"
                   step="1"
                   oninput="validatePrice(this)">
        </div>
        <div id="priceError" class="invalid-feedback d-none">
            Цена должна быть от 0 до 999 999 999
        </div>
        <div class="form-text">
            <i class="fas fa-info-circle me-1"></i>
            Максимальная цена: 999 999 999 ₽
        </div>
    </div>
</div>

<!-- ===== ОПИСАНИЕ ===== -->
<div th:fragment="description">
    <div class="mb-4">
        <label for="full_text" class="form-label">
            <i class="fas fa-align-left me-1 text-muted"></i>Описание товара
        </label>
        <textarea id="full_text" name="fullText"
                  placeholder="Введите описание товара (необязательно)"
                  class="form-control" rows="5"></textarea>
        <div class="form-text">Подробно опишите товар, его характеристики и состояние</div>
    </div>
</div>

<!-- ===== МЕСТОПОЛОЖЕНИЕ ===== -->
<div th:fragment="location">
    <div class="mb-4">
        <label class="form-label">
            <i class="fas fa-map-marker-alt me-1 text-muted"></i>Местоположение <span class="text-danger">*</span>
        </label>
        <div class="input-group mb-2">
            <input type="text" id="locationInput" name="location"
                   class="form-control" placeholder="Введите адрес или выберите на карте"
                   required>
            <button type="button" class="btn btn-outline-secondary" onclick="clearLocation()">
                <i class="fas fa-times me-1"></i>Очистить
            </button>
        </div>
        <div class="form-text mb-2">
            <i class="fas fa-info-circle me-1"></i>📍 Введите адрес вручную или кликните на карте для выбора
        </div>
        <div id="map" class="map-container"></div>
    </div>
</div>

<!-- ===== ИЗОБРАЖЕНИЯ ===== -->
<div th:fragment="images">
    <div class="mb-4">
        <label for="files" class="form-label">
            <i class="fas fa-images me-1 text-muted"></i>Изображения товара <span class="text-danger">*</span>
        </label>
        <input type="file" name="files" id="files" class="form-control" multiple accept="image/*" required>
        <div class="form-text">
            <i class="fas fa-info-circle me-1"></i>Вы можете выбрать несколько изображений, удерживая Ctrl (или Cmd на Mac). Максимум 5 изображений
        </div>
    </div>
</div>
</body>
</html>
