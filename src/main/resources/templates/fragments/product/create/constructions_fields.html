<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="constructionsFields">
    <div id="constructionsFields" class="filter-group mb-4" style="display: none;">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-car me-2"></i>Тип назначения материалов
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Тип назначения <span class="text-danger">*</span></label>
                        <select id="constructionsType" name="constructionsType" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('constructions', 'constructions', 'constructionsType')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
