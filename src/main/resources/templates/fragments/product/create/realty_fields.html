<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="realtyFields">
    <div id="realtyFields" class="filter-group mb-4" style="display: none;">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-building me-2"></i>Характеристики недвижимости
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Тип недвижимости <span class="text-danger">*</span></label>
                        <select id="propertyType" name="propertyType" class="form-select">
                            <option value="">Выберите тип</option>
                            <option value="apartment">Квартира</option>
                            <option value="house">Дом</option>
                            <option value="land">Участок</option>
                            <option value="garage">Гараж</option>
                            <option value="commercial">Коммер. недвиж.</option>
                        </select>
                    </div>
                </div>

                <!-- Поля для квартиры -->
                <div id="apartmentFields" style="display: none;" class="row">

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Материал дома <span class="text-danger">*</span></label>
                        <select id="materialUp" name="materialUp" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('realty', 'apartment', 'materialUp')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Кол-во комнат <span class="text-danger">*</span></label>
                        <input id="roomsCount" type="number" name="roomsCount" class="form-control"
                               min="0" step="1" placeholder="Например: 2">
                        <small class="text-muted">0 - студия</small>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Этаж <span class="text-danger">*</span></label>
                        <input id="floorsApartment" type="number" name="floorsApartment" class="form-control"
                               min="1" step="1" placeholder="Например: 5">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Кол-во этажей <span class="text-danger">*</span></label>
                        <input id="floorsCount" type="number" name="floorsCount" class="form-control"
                               min="1" step="1" placeholder="Например: 5">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Лифт <span class="text-danger">*</span></label>
                        <select id="hasElevator" name="hasElevator" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('realty', 'apartment', 'hasElevator')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Год постройки <span class="text-danger">*</span></label>
                        <input id="buildYear" type="number" name="buildYear" class="form-control"
                               min="1900" max="2099" step="1" placeholder="Например: 2005">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Ремонт <span class="text-danger">*</span></label>
                        <select id="repairUp" name="repairUp" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('realty', 'apartment', 'repairUp')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>

                </div>

                <!-- Поля для дома-->
                <div id="houseFields" style="display: none;" class="row">

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Материал дома <span class="text-danger">*</span></label>
                        <select id="materialHouse" name="materialHouse" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('realty', 'house', 'materialHouse')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Кол-во этажей <span class="text-danger">*</span></label>
                        <input id="floorsCountHouse" type="number" name="floorsCountHouse" class="form-control"
                               min="1" step="1" placeholder="Например: 2">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">Ремонт <span class="text-danger">*</span></label>
                        <select id="repairHouse" name="repairHouse" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('realty', 'house', 'repairHouse')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Пл. дома (м²) <span class="text-danger">*</span></label>
                        <input id="houseArea" type="number" name="houseArea" class="form-control"
                               min="1" step="1" placeholder="Например: 150">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Пл. земли (сот) <span class="text-danger">*</span></label>
                        <input id="landArea" type="number" name="landArea" class="form-control"
                               min="1" step="1" placeholder="Например: 20">
                    </div>

                    <div class="col-md-2 mb-3">
                        <label class="form-label">Год постройки <span class="text-danger">*</span></label>
                        <input id="buildYearHouse" type="number" name="buildYear" class="form-control" min="1900" max="2099" step="1" placeholder="Например: 2005">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Расст. до города (км) <span class="text-danger">*</span></label>
                        <input id="distanceToCityHouse" type="number" name="distanceToCityHouse" class="form-control" min="0" step="1" placeholder="Введите расстояние">
                    </div>

                </div>

                <!-- Поля для участка -->
                <div id="landFields" style="display: none;" class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Площадь (сот) <span class="text-danger">*</span></label>
                        <input id="landAreaLand" type="number" name="landArea" class="form-control" min="1" step="1" placeholder="Введите площадь">
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Расст. до города (км) <span class="text-danger">*</span></label>
                        <input id="distanceToCity" type="number" name="distanceToCity" class="form-control" min="0" step="1" placeholder="Введите расстояние">
                    </div>
                </div>

                <!-- Поля для Гаража -->
                <div id="garageFields" style="display: none;" class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Площадь (м²) <span class="text-danger">*</span></label>
                        <input id="landAreaGarage" type="number" name="landAreaGarage" class="form-control" min="1" step="1" placeholder="Введите площадь">
                    </div>

                </div>

                <!-- Поля для комерческой -->
                <div id="commercialFields" style="display: none;" class="row">

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Площадь (м²) <span class="text-danger">*</span></label>
                        <input id="landAreaCommercial" type="number" name="landAreaCommercial" class="form-control" min="1" step="1" placeholder="Введите площадь">
                    </div>

                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
