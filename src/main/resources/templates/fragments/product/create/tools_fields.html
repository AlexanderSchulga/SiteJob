<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toolsFields">
    <div id="toolsFields" class="filter-group mb-4" style="display: none;">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-car me-2"></i>Инструменты
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Тип <span class="text-danger">*</span></label>
                        <select id="toolsType" name="toolsType" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('tools', 'tools', 'toolsType')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Состояние <span class="text-danger">*</span></label>
                        <select id="conditionTools" name="conditionTools" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('tools', 'tools', 'conditionTools')}"
                                    th:value="${option.key}"
                                    th:text="${option.value}">
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
