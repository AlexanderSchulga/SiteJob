<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="appliancesDetails(post)">
        <div class="row">
            <div class="col-md-6">
                <div th:if="${post.appliancesTypeDisplayName != null}">
                    <small class="text-muted d-block">
                        <strong>Тип:</strong>
                        <span th:text="${post.appliancesTypeDisplayName}"></span>
                    </small>
                </div>

                <div th:if="${post.conditionAppliancesDisplayName != null}">
                    <small class="text-muted d-block">
                        <strong>Состояние:</strong>
                        <span th:text="${post.conditionAppliancesDisplayName}"></span>
                    </small>
                </div>

            </div>
        </div>
</div>
</body>
</html>
