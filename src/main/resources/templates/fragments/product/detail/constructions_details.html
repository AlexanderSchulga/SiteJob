<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="constructionsDetails(post)">
        <div class="row">
            <div class="col-md-6">
                <div th:if="${post.constructionsTypeDisplayName != null}">
                    <small class="text-muted d-block">
                        <strong>Тип назначения:</strong>
                        <span th:text="${post.constructionsTypeDisplayName}"></span>
                    </small>
                </div>
            </div>
        </div>
</div>
</body>
</html>
