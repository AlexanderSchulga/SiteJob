<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="foodDetails(post)">

        <div class="row">
            <div class="col-md-6">
                <div th:if="${post.foodKindDisplayName != null}">
                    <small class="text-muted d-block">
                        <strong>Вид:</strong>
                        <span th:text="${post.foodKindDisplayName}"></span>
                    </small>
                </div>

        </div>
    </div>
</div>
</body>
</html>
