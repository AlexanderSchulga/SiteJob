<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="toolsDetails(post)">

        <div class="row">
            <div class="col-md-6">
                <div th:if="${post.toolsTypeDisplayName != null}">
                    <small class="text-muted d-block">
                        <strong>Тип:</strong>
                        <span th:text="${post.toolsTypeDisplayName}"></span>
                    </small>
                </div>

                <div th:if="${post.conditionToolsDisplayName != null}">
                    <small class="text-muted d-block">
                        <strong>Состояние:</strong>
                        <span th:text="${post.conditionToolsDisplayName}"></span>
                    </small>
                </div>

            </div>
        </div>

</div>
</body>
</html>
