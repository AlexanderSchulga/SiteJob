<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="constructionsFields(el)">
    <div id="constructionsFieldsEdit" class="filter-group mb-4" th:attr="data-category=${el.category}">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-car me-2"></i>Тип назначения материалов
            </div>
            <div class="card-body">
                <div class="row">

                    <div class="col-md-3 mb-3 filter-group">
                        <label class="form-label">Тип назначения <span class="text-danger">*</span></label>
                        <select id="constructionsType" name="constructionsType" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('constructions', 'constructions', 'constructionsType')}"
                                    th:if="${option.key != ''}"
                                    th:value="${option.key}"
                                    th:text="${option.value}"
                                    th:selected="${el.constructionsType != null and el.constructionsType == option.key}">
                            </option>
                        </select>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
