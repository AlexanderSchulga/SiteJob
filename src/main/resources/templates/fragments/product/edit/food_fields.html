<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="foodFields(el)">
    <div id="foodFieldsEdit" class="filter-group mb-4" th:attr="data-category=${el.category}">
        <div class="card">
            <div class="card-header bg-light">
                <i class="fas fa-car me-2"></i>Продукты питания
            </div>
            <div class="card-body">
                <div class="row">

                    <div class="col-md-3 mb-3 filter-group">
                        <label class="form-label">Вид <span class="text-danger">*</span></label>
                        <select id="foodKind" name="foodKind" class="form-select">
                            <option th:each="option : ${@filterConfigService.getOptions('food', 'food', 'foodKind')}"
                                    th:if="${option.key != ''}"
                                    th:value="${option.key}"
                                    th:text="${option.value}"
                                    th:selected="${el.foodKind != null and el.foodKind == option.key}">
                            </option>
                        </select>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
