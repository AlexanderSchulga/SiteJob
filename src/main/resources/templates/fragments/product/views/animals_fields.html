<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="animalsFilters">
    <div class="card mb-3">
        <div class="card-header bg-light">
            <i class="fas fa-paw me-2"></i>Флора и фауна
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 col-sm-6 mb-2">
                    <label for="animalsKind">Вид</label>
                    <select id="animalsKind" name="animalsKind" class="form-select form-select-sm">
                        <option th:each="option : ${@filterConfigService.getOptions('animals', 'animals', 'animalsKind')}"
                                th:value="${option.key}"
                                th:text="${option.value}"
                                th:selected="${animalsKind != null and animalsKind.toString() == option.key}">
                        </option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
