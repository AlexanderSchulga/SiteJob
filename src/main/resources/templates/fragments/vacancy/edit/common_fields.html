<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ===== НАЗВАНИЕ ===== -->
<div th:fragment="title(el)">
    <div class="mb-4">
        <label for="vacancy_title" class="form-label">
            <i class="fas fa-heading me-1 text-muted"></i>Название вакансии <span class="text-danger">*</span>
        </label>
        <input type="text" id="vacancy_title" th:value="${el.title}"
               name="title" placeholder="Введите название вакансии" class="form-control" required>
    </div>
</div>

<!-- ===== ЗАРПЛАТА ===== -->
<div th:fragment="salary(el)">
    <div class="mb-4">
        <label for="vacancy_cash" class="form-label">
            <i class="fas fa-ruble-sign me-1 text-muted"></i>Зарплата <span class="text-danger">*</span>
        </label>
        <div class="input-group">
            <span class="input-group-text">₽</span>
            <input type="number" id="vacancy_cash" th:value="${el.cash}"
                   name="cash" placeholder="Укажите зарплату" class="form-control" required min="0" step="1">
        </div>
    </div>
</div>

<!-- ===== КАТЕГОРИЯ (только для чтения) ===== -->
<div th:fragment="categoryReadonly(el, categories)">
    <div class="mb-4">
        <label class="form-label">
            <i class="fas fa-tag me-1 text-muted"></i>Категория вакансии
        </label>
        <input type="text" class="form-control"
               th:value="${categories.get(el.category)}" disabled>
        <input type="hidden" name="category" th:value="${el.category}">
        <div class="form-text text-muted">Категория не может быть изменена</div>
    </div>
</div>

<!-- ===== ОПЫТ РАБОТЫ ===== -->
<div th:fragment="experience(el, experience)">
    <div class="mb-4">
        <label for="vacancy_experience" class="form-label">
            <i class="fas fa-briefcase me-1 text-muted"></i>Опыт работы <span class="text-danger">*</span>
        </label>
        <select id="vacancy_experience" name="experience" class="form-select" required>
            <option th:each="exp : ${experience}"
                    th:if="${exp.key != 'all'}"
                    th:value="${exp.key}"
                    th:selected="${exp.key == el.experience}"
                    th:text="${exp.value}">
            </option>
        </select>
    </div>
</div>

<!-- ===== ФОРМАТ РАБОТЫ ===== -->
<div th:fragment="workformat(el, workformat)">
    <div class="mb-4">
        <label for="vacancy_workformat" class="form-label">
            <i class="fas fa-building me-1 text-muted"></i>Формат работы <span class="text-danger">*</span>
        </label>
        <select id="vacancy_workformat" name="workformat" class="form-select" required>
            <option th:each="wf : ${workformat}"
                    th:if="${wf.key != 'all'}"
                    th:value="${wf.key}"
                    th:selected="${wf.key == el.workformat}"
                    th:text="${wf.value}">
            </option>
        </select>
    </div>
</div>

<!-- ===== ОПИСАНИЕ ===== -->
<div th:fragment="description(el)">
    <div class="mb-4">
        <label for="vacancy_full_text" class="form-label">
            <i class="fas fa-align-left me-1 text-muted"></i>Описание вакансии
        </label>
        <textarea id="vacancy_full_text" name="full_text"
                  placeholder="Опишите обязанности, требования и условия работы"
                  class="form-control" rows="5"
                  th:text="${el.full_text != null ? el.full_text : ''}"></textarea>
        <div class="form-text">Опишите обязанности, требования и условия работы.</div>
    </div>
</div>

<!-- ===== МЕСТОПОЛОЖЕНИЕ С КАРТОЙ ===== -->
<div th:fragment="location(el, mapId)">
    <div class="mb-4">
        <label class="form-label">
            <i class="fas fa-map-marker-alt me-1 text-muted"></i>Местоположение <span class="text-danger">*</span>
        </label>
        <div class="input-group mb-2">
            <input type="text" th:id="'locationInput_' + ${mapId}"
                   name="location"
                   class="form-control"
                   placeholder="Введите адрес или выберите на карте"
                   th:value="${el?.location}"
                   required>
            <button type="button" class="btn btn-outline-secondary"
                    th:onclick="'clearLocation(\'' + ${mapId} + '\')'">
                <i class="fas fa-times me-1"></i>Очистить
            </button>
        </div>
        <div class="form-text mb-2">
            <i class="fas fa-info-circle me-1"></i>📍 Введите адрес вручную или кликните на карте для выбора
        </div>
        <div th:id="'map_' + ${mapId}"
             class="map-container"
             style="width: 100%; height: 400px; border: 1px solid #ddd; border-radius: 8px;"
             th:data-location="${el?.location}"
             th:data-input-id="'locationInput_' + ${mapId}">
        </div>
    </div>
</div>

<!-- ===== ИЗОБРАЖЕНИЯ ===== -->
<div th:fragment="images(el, prefix)">
    <div class="mb-4">
        <label class="form-label fw-bold">
            <i class="fas fa-images me-1 text-muted"></i>Изображения
        </label>
        <div th:if="${not #lists.isEmpty(el.images)}" class="row g-3 mb-3">
            <div th:each="image, stat : ${el.images}" class="col-6 col-md-4 col-lg-3">
                <div class="image-card position-relative border rounded p-2"
                     th:classappend="${image.markedForDeletion} ? 'marked-for-deletion' : ''">
                    <img th:src="${image.imagePath}" class="img-fluid rounded"
                         style="height: 120px; width: 100%; object-fit: cover;">
                    <div class="form-check mt-2">
                        <input type="checkbox" name="deleteImageIds" th:value="${image.id}"
                               class="form-check-input" th:checked="${image.markedForDeletion}"
                               th:id="${prefix} + 'DeleteImg_' + ${stat.index}">
                        <label class="form-check-label small" th:for="${prefix} + 'DeleteImg_' + ${stat.index}"
                               th:classappend="${image.markedForDeletion} ? 'text-danger fw-bold' : 'text-muted'">
                            <i class="fas fa-trash-alt me-1"></i>
                            <span th:if="${image.markedForDeletion}">Будет удалено</span>
                            <span th:unless="${image.markedForDeletion}">Удалить</span>
                        </label>
                    </div>
                    <div th:if="${image.markedForDeletion}" class="small text-warning mt-1">
                        <i class="fas fa-clock me-1"></i>После модерации
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(el.images)}" class="alert alert-light mb-3">
            <i class="fas fa-info-circle me-2"></i>Нет загруженных изображений
        </div>

        <label th:for="${prefix} + '_files'" class="form-label mt-2">
            <i class="fas fa-plus-circle me-1 text-muted"></i>Добавить новые изображения
        </label>
        <input type="file" th:id="${prefix} + '_files'" name="files"
               class="form-control" multiple accept="image/*">
        <div class="form-text">Можно выбрать несколько файлов. Максимум 5 изображений.</div>
        <div class="small text-muted mt-1">
            <i class="fas fa-images me-1"></i>
            Всего изображений: <span th:text="${el.images.size()}">0</span>
        </div>
    </div>
</div>

<!-- ===== SUBMIT КНОПКИ ===== -->
<div th:fragment="submitButtons">
    <div class="d-flex gap-3 mt-4">
        <button type="submit" class="btn btn-success">
            <i class="fas fa-save me-2"></i>Обновить и отправить на модерацию
        </button>
        <a th:href="@{/page_two/redactor}" class="btn btn-outline-secondary">
            <i class="fas fa-times me-2"></i>Отмена
        </a>
    </div>
</div>

</body>
</html>
