<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/styleviewsone.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
</head>

<body>

<script th:inline="javascript">
    // Передаем данные о текущем пользователе в JavaScript
    window.currentUser = {
        id: [[${currentUser?.id}]],
        role: [[${currentUser?.role}]],
        nameuse: [[${currentUser?.nameuse}]]
    };

    // Передаем CSRF токен для динамических форм
    window.csrfTokenName = [[${_csrf?.parameterName}]];
    window.csrfTokenValue = [[${_csrf?.token}]];
</script>

<div class="container-wrapper">
    <div th:replace="~{block/header :: headerhtml}"></div>

    <div class="container mt-4" style="padding-left: 0; padding-right: 0; max-width: 100%;">
        <h2 class="text-center mb-4" style="color:black;">Поиск и просмотр товаров</h2>

        <!-- Результаты поиска -->
        <div th:if="${searchQuery}" class="search-results-info mb-4">
            <h3>Результаты поиска товаров: "<span th:text="${searchQuery}"></span>"</h3>
            <p>Найдено товаров: <span th:text="${totalItems}"></span></p>
            <a th:href="@{/page_one/viewsone}" class="btn btn-primary">Показать все товары</a>
        </div>

        <!-- Блок фильтров -->
        <div class="filters-container">
            <!-- Строка 1: Категории (50% ширины) -->
            <div class="row">
                <div class="col-12 col-md-6 mb-3">
                    <h3>Категория</h3>
                    <div class="category-dropdown" id="categoryDropdown">
                        <div class="category-select" id="categorySelect">
                            <span id="selectedCategoryText" th:text="${categories['all']}">Все товары</span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="category-options" id="categoryOptions">
                            <div th:each="category : ${categories}"
                                 class="category-option"
                                 th:attr="data-category=${category.key}"
                                 th:text="${category.value}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Скрытые поля для передачи параметров фильтров при сортировке -->
            <input type="hidden" id="hiddenPropertyType" th:value="${propertyType}">
            <input type="hidden" id="hiddenRoomsCount" th:value="${roomsCount}">
            <input type="hidden" id="hiddenApartmentFloorsCount" th:value="${apartmentFloorsCount}">
            <input type="hidden" id="hiddenFloorsCountHouse" th:value="${floorsCountHouse}">
            <input type="hidden" id="hiddenHasElevator" th:value="${hasElevator}">
            <input type="hidden" id="hiddenApartmentBuildYear" th:value="${apartmentBuildYear}">
            <input type="hidden" id="hiddenHouseBuildYear" th:value="${houseBuildYear}">
            <input type="hidden" id="hiddenHouseArea" th:value="${houseArea}">
            <input type="hidden" id="hiddenLandArea" th:value="${landArea}">
            <input type="hidden" id="hiddenDistanceToCity" th:value="${distanceToCity}">
            <input type="hidden" id="hiddenVehicleType" th:value="${vehicleType}">
            <input type="hidden" id="hiddenVehicleOrigin" th:value="${vehicleOrigin}">
            <input type="hidden" id="hiddenVehicleYear" th:value="${vehicleYear}">

            <input type="hidden" id="hiddenMaterialUp" th:value="${materialUp}">
            <input type="hidden" id="hiddenRepairUp" th:value="${repairUp}">
            <input type="hidden" id="hiddenMaterialHouse" th:value="${materialHouse}">
            <input type="hidden" id="hiddenRepairHouse" th:value="${repairHouse}">
            <input type="hidden" id="hiddenDistanceToCityHouse" th:value="${distanceToCityHouse}">
            <input type="hidden" id="hiddenLandAreaGarage" th:value="${landAreaGarage}">
            <input type="hidden" id="hiddenLandAreaCommercial" th:value="${landAreaCommercial}">

            <input type="hidden" id="hiddenMileage" th:value="${mileage}">
            <input type="hidden" id="hiddenNumberOfOwners" th:value="${numberOfOwners}">

            <!-- Для автозапчастей (auto) -->
            <input type="hidden" id="hiddenAutoType" th:value="${autoType}">
            <input type="hidden" id="hiddenConditionAuto" th:value="${conditionAuto}">

            <!-- Для строительных материалов (constructions) -->
            <input type="hidden" id="hiddenConstructionsType" th:value="${constructionsType}">

            <!-- Для дома и интерьера (interior) -->
            <input type="hidden" id="hiddenInteriorType" th:value="${interiorType}">
            <input type="hidden" id="hiddenConditionInterior" th:value="${conditionInterior}">

            <!-- Для инструментов (tools) -->
            <input type="hidden" id="hiddenToolsType" th:value="${toolsType}">
            <input type="hidden" id="hiddenConditionTools" th:value="${conditionTools}">

            <!-- Для бытовой техники (appliances) -->
            <input type="hidden" id="hiddenAppliancesType" th:value="${appliancesType}">
            <input type="hidden" id="hiddenConditionAppliances" th:value="${conditionAppliances}">

            <!-- Для электроники (electronics) -->
            <input type="hidden" id="hiddenElectronicsType" th:value="${electronicsType}">
            <input type="hidden" id="hiddenConditionElectronics" th:value="${conditionElectronics}">

            <!-- Для одежды и обуви (clothing) -->
            <input type="hidden" id="hiddenClothingType" th:value="${clothingType}">
            <input type="hidden" id="hiddenGenderClothing" th:value="${genderClothing}">
            <input type="hidden" id="hiddenConditionClothing" th:value="${conditionClothing}">

            <!-- Для детских товаров (childrenPr) -->
            <input type="hidden" id="hiddenGenderChildrenPr" th:value="${genderChildrenPr}">
            <input type="hidden" id="hiddenConditionChildrenPr" th:value="${conditionChildrenPr}">

            <!-- Для спортивных товаров (sports) -->
            <input type="hidden" id="hiddenSportsKind" th:value="${sportsKind}">
            <input type="hidden" id="hiddenSportsType" th:value="${sportsType}">
            <input type="hidden" id="hiddenGenderSports" th:value="${genderSports}">
            <input type="hidden" id="hiddenConditionSports" th:value="${conditionSports}">

            <!-- Для продуктов питания (food) -->
            <input type="hidden" id="hiddenFoodKind" th:value="${foodKind}">

            <!-- Для здоровья и красоты (health) -->
            <input type="hidden" id="hiddenHealthKind" th:value="${healthKind}">
            <input type="hidden" id="hiddenHealthType" th:value="${healthType}">
            <input type="hidden" id="hiddenGenderHealth" th:value="${genderHealth}">

            <!-- Для флоры и фауны (animals) -->
            <input type="hidden" id="hiddenAnimalsKind" th:value="${animalsKind}">

            <!-- ====== РАСШИРЕННЫЕ ФИЛЬТРЫ ====== -->
            <div class="row mt-3">
                <div class="col-12">
                    <div class="filter-container">
                        <h3>Дополнительные фильтры</h3>

                        <!-- Фильтры для НЕДВИЖИМОСТИ -->
                        <div id="realtyFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/realty_filters :: realtyFilters}"></div>
                        </div>

                        <!-- Фильтры для АВТОТРАНСПОРТА -->
                        <div id="vehicleFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/vehicle_filters :: vehicleFilters}"></div>
                        </div>

                        <!---Автозапчасти и автотовары---->
                        <div id="autoFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/auto_fields :: autoFilters}"></div>
                        </div>

                        <!---Строительные материалы----->
                        <div id="constructionsFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/constructions_fields :: constructionsFilters}"></div>
                        </div>

                        <!---"Дом и интерьер----->
                        <div id="interiorFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/interior_fields :: interiorFilters}"></div>
                        </div>

                        <!---"Инструменты----->
                        <div id="toolsFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/tools_fields :: toolsFilters}"></div>
                        </div>

                        <!---"Бытовая техника----->
                        <div id="appliancesFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/appliances_fields :: appliancesFilters}"></div>
                        </div>

                        <!---Электроника и гаджеты---->
                        <div id="electronicsFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/electronics_fields :: electronicsFilters}"></div>
                        </div>

                        <!---Одежда и обувь---->
                        <div id="clothingFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/clothing_fields :: clothingFilters}"></div>
                        </div>

                        <!---Детские товары---->
                        <div id="childrenPrFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/children_fields :: childrenPrFilters}"></div>
                        </div>

                        <!---Товары для спорта---->
                        <div id="sportsFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/sports_fields :: sportsFilters}"></div>
                        </div>

                        <!---Продукты питания---->
                        <div id="foodFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/food_fields :: foodFilters}"></div>
                        </div>

                        <!---Здоровье и красота---->
                        <div id="healthFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/health_fields :: healthFilters}"></div>
                        </div>

                        <!---Флора и фауна--->
                        <div id="animalsFilters" class="filter-group" style="display: none;">
                            <div th:replace="~{fragments/product/views/animals_fields :: animalsFilters}"></div>
                        </div>

                        <!-- Кнопка применения фильтров -->
                        <div id="filterButtonsContainer" style="display: none;">
                            <button id="applyFilters" class="btn btn-primary">
                                <i class="fas fa-filter"></i><span>Применить фильтры</span>
                            </button>
                            <button id="resetFilters" class="btn btn-secondary">
                                <i class="fas fa-undo"></i><span>Сбросить</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Строка 2: Сортировка по дате + Сортировка по цене (каждая по 50% ширины) -->
            <div class="row">
                <div class="col-6 col-md-6 mb-3">
                    <h3>Сортировка по дате</h3>
                    <div class="sort-dropdown" id="sortDropdown">
                        <input type="hidden" id="currentSort" th:value="${currentSort}">
                        <div class="sort-select" id="sortSelect">
                            <span id="selectedSortText">
                                <span th:if="${param.sort != null and param.sort[0] == 'old'}">Сначала старые</span>
                                <span th:if="${param.sort == null or param.sort[0] == 'new'}">Сначала свежие</span>
                            </span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="sort-options" id="sortOptions">
                            <div class="sort-option" data-sort="newest">Сначала свежие</div>
                            <div class="sort-option" data-sort="oldest">Сначала старые</div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-6 mb-3">
                    <h3>Сортировка по цене</h3>
                    <div class="sort-dropdown" id="priceSortDropdown">
                        <input type="hidden" id="currentPriceSort" th:value="${currentPriceSort}">
                        <div class="sort-select" id="priceSortSelect">
                            <span id="selectedPriceSortText">
                                <span th:if="${param.priceSort != null}">
                                    <span th:if="${param.priceSort[0] == 'price_asc'}">По возрастанию цены</span>
                                    <span th:if="${param.priceSort[0] == 'price_desc'}">По убыванию цены</span>
                                </span>
                                <span th:if="${param.priceSort == null}">По умолчанию</span>
                            </span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="sort-options" id="priceSortOptions">
                            <div class="sort-option" data-price-sort="none">По умолчанию</div>
                            <div class="sort-option" data-price-sort="price_asc">По возрастанию цены</div>
                            <div class="sort-option" data-price-sort="price_desc">По убыванию цены</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Строка 3: Регион + Город (каждая по 50% ширины) -->
            <div class="row">
                <div class="col-6 col-md-6 mb-3">
                    <h3>Регион</h3>
                    <div class="region-dropdown" id="regionDropdown">
                        <div class="region-select" id="regionSelect">
                            <span id="selectedRegionText" th:text="${regions['all']}">Все регионы</span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="region-options" id="regionOptions">
                            <div th:each="region : ${regions}"
                                 class="region-option"
                                 th:attr="data-region=${region.key}"
                                 th:text="${region.value}">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-md-6 mb-3">
                    <h3>Населенный пункт</h3>
                    <div class="city-dropdown" id="cityDropdown">
                        <div class="city-select" id="citySelect">
                            <span id="selectedCityText">
                                <span th:if="${selectedCity == 'all' or selectedCity == null}">
                                    Все пункты
                                </span>
                                <span th:if="${selectedCity == 'other_none'}">
                                    Другие пункты
                                </span>
                                <span th:if="${selectedCity == 'none'}">
                                    Город не указан
                                </span>
                                <span th:if="${selectedCity != 'all' and selectedCity != 'other_none'
                                               and selectedCity != 'none' and selectedCity != null}">
                                    <span th:text="${@regionsConfig.getCityDisplayName(selectedRegion, selectedCity)}"></span>
                                </span>
                            </span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="city-options" id="cityOptions">
                            <div class="city-option" data-city="all">Все пункты</div>

                            <div th:if="${citiesByGroup != null and citiesByGroup.containsKey('standard')
                         and not citiesByGroup['standard'].isEmpty()}">
                                <div class="dropdown-divider"></div>
                                <div class="city-group-header">Основные города</div>
                                <div th:each="city : ${citiesByGroup['standard']}"
                                     class="city-option"
                                     th:attr="data-city=${city}"
                                     th:text="${city}">
                                </div>
                            </div>

                            <div th:if="${citiesByGroup != null and (citiesByGroup.containsKey('other')
                         or citiesByGroup.containsKey('none'))}">
                                <div class="dropdown-divider"></div>
                                <div class="city-group-header">Другие варианты</div>

                                <div th:if="${citiesByGroup.containsKey('other')}">
                                    <div class="city-option" data-city="other_none">Другие пункты</div>
                                </div>

                                <div th:if="${citiesByGroup.containsKey('none')}">
                                    <div class="city-option" data-city="none">Город не указан</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Бейджи текущих фильтров -->
            <div class="row">
                <div th:if="${selectedCity == 'other_none'}" class="mb-2">
                    <span class="badge bg-warning fs-6">
                        Город: Другие населенные пункты
                    </span>
                </div>

                <div th:if="${selectedCategory != 'all' or selectedRegion != 'all'}"
                     class="current-filters-badge col-12">
                    <div th:if="${selectedCategory != 'all'}" class="mb-2">
                        <span class="badge bg-success fs-6">
                            Категория:
                            <span th:text="${@postTextCategoryConfig.getCategoryDisplayName(selectedCategory)}"></span>
                        </span>
                    </div>
                    <div th:if="${selectedRegion != 'all'}">
                        <span class="badge bg-info fs-6">
                            Регион:
                            <span th:text="${@regionsConfig.getRegionDisplayName(selectedRegion)}"></span>
                        </span>
                    </div>

                    <div th:if="${selectedCity != 'all' and selectedCity != null
                           and selectedCity != 'none' and selectedCity != 'other_none'}" class="mb-2">
                        <span class="badge bg-warning fs-6">
                            Город:
                            <span th:text="${@regionsConfig.getCityDisplayName(selectedRegion, selectedCity)}"></span>
                        </span>
                    </div>
                    <div th:if="${selectedCity == 'none'}" class="mb-2">
                        <span class="badge bg-warning fs-6">
                            Город: Не указан
                        </span>
                    </div>
                </div>

                <!-- Кнопка сброса фильтров -->
                <div th:if="${selectedCategory != 'all' or selectedRegion != 'all'}"
                     class="col-12 mb-3">
                    <a th:href="@{/page_one/viewsone}" class="btn btn-secondary" id="resetAllFilters">
                        <i class="fas fa-undo"></i>
                        Сбросить все фильтры
                    </a>
                </div>
            </div>

            <!-- Строка 4: Поиск (50% ширины) -->
            <div class="row">
                <div class="col-12 col-md-6">
                    <h3>Поиск по товарам</h3>
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control" placeholder="Поиск...">
                        <button class="btn btn-outline-secondary" type="button" id="searchButton">
                            <i class="fas fa-search"></i>
                            <span class="search-btn-text" style="display: none;">Найти</span>
                        </button>
                        <button class="btn btn-outline-danger" type="button" id="clearSearchButton">
                            <i class="fas fa-times"></i>
                            <span class="clear-btn-text" style="display: none;">Отмена</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Контейнер для постов -->
        <div id="postsContainer" class="row">
            <div th:each="el : ${posts}" class="col-md-6 col-lg-4 col-xl-3 mb-4">
                <div th:class="${el.premium} ? 'post-card-premium' : (${el.donate} ? 'post-card-donate' : 'post-card')">
                    <div th:if="${el.firstImagePath} != null">
                        <img th:src="${el.firstImagePath}"
                             class="post-image img-fluid"
                             loading="lazy"
                             decoding="async"
                             onerror="this.onerror=null; this.src='/images/no-image.jpg'; this.classList.add('image-error');"
                             th:alt="${el.title}">
                    </div>
                    <div th:unless="${el.firstImagePath}" class="post-image-placeholder d-flex align-items-center justify-content-center bg-light">
                        <i class="fas fa-image fa-3x text-muted"></i>
                    </div>

                    <div class="post-content">
                        <h5 class="post-title" th:text="${el.title}"></h5>
                        <strong>Цена:</strong>
                        <p class="post-anons" th:text="${el.price}"></p>

                        <a th:href="'/postidviews/' + ${el.hashId}" class="btn btn-edit w-100 mb-2">
                            <i class="fas fa-eye me-1"></i> Детальнее
                        </a>

                        <!-- Контейнер для кнопок админа -->
                        <div th:if="${#authorization.expression('hasRole(''ROLE_ADMIN'')') or #authorization.expression('hasRole(''ROLE_SUPER'')')}"
                             class="post-buttons">

                            <form th:action="'/viewsone/post/' + ${el.hashId} + '/toggle-block'" method="post" class="d-inline w-50">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-mod w-100 toggle-block-btn"
                                        type="button"
                                        th:classappend="${el.blocked} ? 'btn-success' : 'btn-secondary'"
                                        th:attr="data-post-type='товар'"
                                        th:title="${el.blocked} ? 'Разблокировать' : 'Заблокировать'">
                                    <i th:class="${el.blocked} ? 'fas fa-unlock' : 'fas fa-ban'"></i>
                                    <span class="d-none d-md-inline" th:text="${el.blocked} ? ' Разблок.' : ' Блок.'"></span>
                                </button>
                            </form>

                            <form th:action="'/viewsone/post/' + ${el.hashId} + '/remove'" method="post" class="d-inline w-50">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn btn-mod btn-danger w-100 delete-post-btn"
                                        type="button"
                                        data-post-type="товар"
                                        title="Удалить">
                                    <i class="fas fa-trash"></i>
                                    <span class="d-none d-md-inline"> Удалить</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Сообщение если нет товаров -->
        <div th:if="${posts.isEmpty()}" class="text-center mt-5">
            <h4 style="color: #6c757d;">Товары не найдены</h4>
            <p class="text-muted">Попробуйте изменить параметры поиска или выбрать другую категорию</p>
        </div>

        <!-- Кнопка "Показать еще" -->
        <div th:if="${hasMore and not posts.isEmpty()}" class="text-center mt-4 mb-5" id="loadMoreContainer">
            <button id="loadMoreBtn" class="btn btn-primary">
                <i class="fas fa-plus-circle"></i>
                Показать еще
            </button>
            <div id="loadingSpinner" class="mt-2" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                <p class="text-muted mt-2">Загружаем еще товары...</p>
            </div>
        </div>

        <!-- Сообщение когда все загружено -->
        <div th:if="${not hasMore and not posts.isEmpty()}" class="text-center mt-4 mb-5" id="allLoadedMessage">
            <p class="text-muted">
                <i class="fas fa-check-circle text-success me-2"></i>
                Все товары загружены
            </p>
        </div>
    </div>
</div>
<footer th:insert="~{block/footer :: footerhtml}"></footer>

<script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/menu_cat_product.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/product_search.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/sort_date_product.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/rating.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/sort_price_product.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/menu_region.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/city_config.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/menu_city.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/filter/filter_down_category.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/filter/custom-filter-select.js}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Используем делегирование событий для всех кнопок
        document.body.addEventListener('click', function(e) {
            // Обработка кнопок блокировки/разблокировки
            if (e.target.closest('.toggle-block-btn')) {
                e.preventDefault();
                const button = e.target.closest('.toggle-block-btn');
                const form = button.closest('form');
                const action = form.getAttribute('action');
                const isBlocked = button.classList.contains('btn-success') ? false : true;
                const postType = button.getAttribute('data-post-type') || 'товар';
                const actionText = isBlocked ? 'заблокировать' : 'разблокировать';

                // Настраиваем модальное окно
                document.getElementById('toggleBlockModalBody').innerHTML =
                    `Вы уверены, что хотите <strong>${actionText}</strong> этот ${postType}?`;

                const confirmBtn = document.getElementById('toggleBlockConfirmBtn');
                confirmBtn.className = isBlocked ? 'btn btn-warning' : 'btn btn-success';
                confirmBtn.textContent = isBlocked ? 'Заблокировать' : 'Разблокировать';

                // Настраиваем форму
                const modalForm = document.getElementById('toggleBlockForm');
                modalForm.setAttribute('action', action);

                // Копируем CSRF токен из исходной формы
                const csrfInput = form.querySelector('input[name="_csrf"]');
                if (csrfInput) {
                    const modalCsrfInput = modalForm.querySelector('input[name="_csrf"]');
                    modalCsrfInput.value = csrfInput.value;
                }

                // Показываем модальное окно
                const modal = new bootstrap.Modal(document.getElementById('toggleBlockModal'));
                modal.show();
            }

            // Обработка кнопок удаления
            if (e.target.closest('.delete-post-btn')) {
                e.preventDefault();
                const button = e.target.closest('.delete-post-btn');
                const form = button.closest('form');
                const action = form.getAttribute('action');
                const postType = button.getAttribute('data-post-type') || 'товар';

                // Настраиваем модальное окно
                document.getElementById('deletePostModalBody').innerHTML =
                    `Вы уверены, что хотите <strong>удалить</strong> этот ${postType}? Это действие нельзя отменить!`;

                // Настраиваем форму
                const modalForm = document.getElementById('deletePostForm');
                modalForm.setAttribute('action', action);

                // Копируем CSRF токен из исходной формы
                const csrfInput = form.querySelector('input[name="_csrf"]');
                if (csrfInput) {
                    const modalCsrfInput = modalForm.querySelector('input[name="_csrf"]');
                    modalCsrfInput.value = csrfInput.value;
                }

                // Показываем модальное окно
                const modal = new bootstrap.Modal(document.getElementById('deletePostModal'));
                modal.show();
            }
        });
    });


    // ===== УПРАВЛЕНИЕ ОТОБРАЖЕНИЕМ КНОПОК ФИЛЬТРОВ =====
    function toggleFilterButtons() {
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');
        const filterButtonsContainer = document.getElementById('filterButtonsContainer');

        if (filterButtonsContainer) {
            // Показываем кнопки только для определенных
            if (category === 'realty' || category === 'motor' || category === 'auto' ||
                category === 'constructions' || category === 'interior' || category === 'tools' ||
                category === 'appliances' || category === 'electronics' || category === 'clothing' ||
                category === 'childrenPr' || category === 'sports' || category === 'food' ||
                category === 'health' || category === 'animals') {
                filterButtonsContainer.style.display = 'block';
            } else {
                filterButtonsContainer.style.display = 'none';
            }
        }
    }

    // Вызываем при загрузке
    toggleFilterButtons();

    // Следим за изменением категории в URL
    window.addEventListener('popstate', function() {
        setTimeout(toggleFilterButtons, 50);
    });

    // Следим за кликами по категориям
    document.addEventListener('click', function(e) {
        const categoryOption = e.target.closest('.category-option');
        if (categoryOption) {
            setTimeout(toggleFilterButtons, 100);
        }
    });
</script>

<script type="text/javascript" th:src="@{/js/paginationPost/load-more.js}"></script>

<!-- Модальное окно для подтверждения блокировки/разблокировки -->
<div class="modal fade" id="toggleBlockModal" tabindex="-1" aria-labelledby="toggleBlockModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="toggleBlockModalLabel">Подтверждение действия</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="toggleBlockModalBody">
                <!-- Текст будет заполняться динамически -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <form id="toggleBlockForm" method="post" style="display: inline;">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn" id="toggleBlockConfirmBtn">Подтвердить</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для подтверждения удаления -->
<div class="modal fade" id="deletePostModal" tabindex="-1" aria-labelledby="deletePostModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="deletePostModalLabel">Подтверждение удаления</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="deletePostModalBody">
                <!-- Текст будет заполняться динамически -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <form id="deletePostForm" method="post" style="display: inline;">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
