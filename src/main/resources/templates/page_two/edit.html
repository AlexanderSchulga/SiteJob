<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
    <link rel="stylesheet" th:href="@{/css/styleedit.css}">
</head>
<body>
<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="container mt-4">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/index}" class="text-decoration-none">
                        <i class="fas fa-home me-1"></i>Главная
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{/page_two/redactor}" class="text-decoration-none">
                        <i class="fas fa-edit me-1"></i>Мои объявления
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Редактирование
                </li>
            </ol>
        </nav>

        <div class="edit-card card shadow-sm">
            <div class="card-header bg-primary">
                <h5 class="mb-0">
                    <i class="fas fa-pen me-2"></i>Редактирование объявления
                </h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Важно:</strong> Изменения и отмеченные для удаления изображения будут применены только после прохождения модерации.
                </div>

                <!-- ===== БЛОК ОШИБКИ ===== -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Ошибка:</strong>
                    <span th:text="${error}">Можно загрузить не более 5 фото</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                </div>

                <!-- ========== ФОРМА ДЛЯ ТОВАРОВ ========== -->
                <div th:if="${type == 'product'}">
                    <div th:each="el, iterStat : ${postwo}">
                        <th:block th:with="mapId='product_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/redactor/' + ${el.hashId} + '/page_two/edit'"
                              enctype="multipart/form-data"
                              th:id="'productForm_' + ${el.id}">

                            <!-- ===== КАТЕГОРИЯ (только для чтения) ===== -->
                            <div th:replace="~{fragments/product/edit/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>

                            <!-- ===== ХАРАКТЕРИСТИКИ (сразу после категории) ===== -->

                            <!-- НЕДВИЖИМОСТЬ (realty) -->
                            <div th:if="${el.category == 'realty'}">
                                <div th:replace="~{fragments/product/edit/realty_fields :: realtyFields(el=${el})}"></div>
                            </div>

                            <!-- АВТОТРАНСПОРТ (motor) -->
                            <div th:if="${el.category == 'motor'}">
                                <div th:replace="~{fragments/product/edit/motor_fields :: motorFields(el=${el})}"></div>
                            </div>

                            <!-- АВТОЗАПЧАСТИ (auto) -->
                            <div th:if="${el.category == 'auto'}">
                                <div th:replace="~{fragments/product/edit/auto_fields :: autoFields(el=${el})}"></div>
                            </div>

                            <!-- СТРОИТЕЛЬНЫЕ МАТЕРИАЛЫ (constructions) -->
                            <div th:if="${el.category == 'constructions'}">
                                <div th:replace="~{fragments/product/edit/constructions_fields :: constructionsFields(el=${el})}"></div>
                            </div>

                            <!-- ДОМ И ИНТЕРЬЕР (interior) -->
                            <div th:if="${el.category == 'interior'}">
                                <div th:replace="~{fragments/product/edit/interior_fields :: interiorFields(el=${el})}"></div>
                            </div>

                            <!-- ИНСТРУМЕНТЫ (tools) -->
                            <div th:if="${el.category == 'tools'}">
                                <div th:replace="~{fragments/product/edit/tools_fields :: toolsFields(el=${el})}"></div>
                            </div>

                            <!-- БЫТОВАЯ ТЕХНИКА (appliances) -->
                            <div th:if="${el.category == 'appliances'}">
                                <div th:replace="~{fragments/product/edit/appliances_fields :: appliancesFields(el=${el})}"></div>
                            </div>

                            <!-- ЭЛЕКТРОНИКА (electronics) -->
                            <div th:if="${el.category == 'electronics'}">
                                <div th:replace="~{fragments/product/edit/electronics_fields :: electronicsFields(el=${el})}"></div>
                            </div>

                            <!-- ОДЕЖДА И ОБУВЬ (clothing) -->
                            <div th:if="${el.category == 'clothing'}">
                                <div th:replace="~{fragments/product/edit/clothing_fields :: clothingFields(el=${el})}"></div>
                            </div>

                            <!-- ДЕТСКИЕ ТОВАРЫ (childrenPr) -->
                            <div th:if="${el.category == 'childrenPr'}">
                                <div th:replace="~{fragments/product/edit/children_fields :: childrenPrFields(el=${el})}"></div>
                            </div>

                            <!-- СПОРТИВНЫЕ ТОВАРЫ (sports) -->
                            <div th:if="${el.category == 'sports'}">
                                <div th:replace="~{fragments/product/edit/sports_fields :: sportsFields(el=${el})}"></div>
                            </div>

                            <!-- ПРОДУКТЫ ПИТАНИЯ (food) -->
                            <div th:if="${el.category == 'food'}">
                                <div th:replace="~{fragments/product/edit/food_fields :: foodFields(el=${el})}"></div>
                            </div>

                            <!-- ЗДОРОВЬЕ И КРАСОТА (health) -->
                            <div th:if="${el.category == 'health'}">
                                <div th:replace="~{fragments/product/edit/health_fields :: healthFields(el=${el})}"></div>
                            </div>

                            <!-- ФЛОРА И ФАУНА (animals) -->
                            <div th:if="${el.category == 'animals'}">
                                <div th:replace="~{fragments/product/edit/animals_fields :: animalsFields(el=${el})}"></div>
                            </div>

                            <!-- ===== ОБЩИЕ ПОЛЯ ===== -->
                            <div th:replace="~{fragments/product/edit/common_fields :: title(el=${el})}"></div>
                            <div th:replace="~{fragments/product/edit/common_fields :: price(el=${el})}"></div>
                            <div th:replace="~{fragments/product/edit/common_fields :: description(el=${el})}"></div>

                            <!-- КАРТА С УНИКАЛЬНЫМ ID -->
                            <div th:replace="~{fragments/product/edit/common_fields :: location(el=${el}, mapId=${mapId})}"></div>

                            <div th:replace="~{fragments/product/edit/common_fields :: images(el=${el}, prefix='product_' + ${el.id})}"></div>

                            <input type="hidden" name="moderation" value="true">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div th:replace="~{fragments/product/edit/common_fields :: submitButtons}"></div>
                        </form>
                    </div>
                </div>

                <!-- ========== ФОРМА ДЛЯ УСЛУГ ========== -->
                <div th:if="${type == 'service'}">
                    <div th:each="el, iterStat : ${postwo}">
                        <th:block th:with="mapId='service_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/redactor/job/' + ${el.hashId} + '/page_two/edit'"
                              enctype="multipart/form-data"
                              th:id="'serviceForm_' + ${el.id}">

                            <div th:replace="~{fragments/service/edit/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>
                            <div th:replace="~{fragments/service/edit/common_fields :: title(el=${el})}"></div>
                            <div th:replace="~{fragments/service/edit/common_fields :: price(el=${el})}"></div>
                            <div th:replace="~{fragments/service/edit/common_fields :: description(el=${el})}"></div>

                            <!-- КАРТА С УНИКАЛЬНЫМ ID -->
                            <div th:replace="~{fragments/service/edit/common_fields :: location(el=${el}, mapId=${mapId})}"></div>

                            <div th:replace="~{fragments/service/edit/common_fields :: images(el=${el}, prefix='service_' + ${el.id})}"></div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div th:replace="~{fragments/service/edit/common_fields :: submitButtons}"></div>
                        </form>
                    </div>
                </div>

                <!-- ========== ФОРМА ДЛЯ ВАКАНСИЙ ========== -->
                <div th:if="${type == 'vacancy'}">
                    <div th:each="el, iterStat : ${vacvac}">
                        <th:block th:with="mapId='vacancy_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/redactor/vac/' + ${el.hashId} + '/page_two/edit'"
                              enctype="multipart/form-data"
                              th:id="'vacancyForm_' + ${el.id}">

                            <div th:replace="~{fragments/vacancy/edit/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: experience(el=${el}, experience=${experience})}"></div>
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: workformat(el=${el}, workformat=${workformat})}"></div>
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: title(el=${el})}"></div>
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: salary(el=${el})}"></div>
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: description(el=${el})}"></div>

                            <!-- КАРТА С УНИКАЛЬНЫМ ID -->
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: location(el=${el}, mapId=${mapId})}"></div>

                            <div th:replace="~{fragments/vacancy/edit/common_fields :: images(el=${el}, prefix='vacancy_' + ${el.id})}"></div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div th:replace="~{fragments/vacancy/edit/common_fields :: submitButtons}"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{block/footer :: footerhtml}"></footer>

<!-- Подключаем универсальный скрипт для карт -->
<script type="text/javascript" th:src="@{/js/fragments/map_location_universal.js}"></script>

<script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/editlimagelimit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-experience-edit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-workformat-edit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/filter/custom-filter-select.js}"></script>
<script type="text/javascript" th:src="@{/js/validate/validate_edit_post.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-edit.js}"></script>


<script>
    // Валидация файлов
    document.addEventListener('DOMContentLoaded', function() {
        const fileInputs = document.querySelectorAll('input[type="file"][multiple]');
        const maxSizeMB = 20;
        const maxSizeBytes = maxSizeMB * 1024 * 1024;

        fileInputs.forEach(input => {
            input.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length > 5) {
                    alert('Можно загрузить не более 5 изображений');
                    e.target.value = '';
                    return;
                }
                for (let i = 0; i < files.length; i++) {
                    if (files[i].size > maxSizeBytes) {
                        alert(`Файл "${files[i].name}" слишком большой! Максимум ${maxSizeMB} MB`);
                        e.target.value = '';
                        return;
                    }
                }
            });
        });

        // Принудительная инициализация карт
        if (typeof reinitMaps === 'function') {
            setTimeout(function() {
                reinitMaps();
            }, 1000);
        }
    });
</script>

</body>
</html>
