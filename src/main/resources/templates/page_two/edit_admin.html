<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
    <link rel="stylesheet" th:href="@{/css/styleedit.css}">
</head>
<body>
<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="container mt-4">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/index}" class="text-decoration-none">
                        <i class="fas fa-home me-1"></i>Главная
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{'/users/' + ${hashId} + '/page_two/admin_edit_user'}" class="text-decoration-none">
                        <i class="fas fa-user-edit me-1"></i>Управление пользователями
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Редактирование объявления (Админ)
                </li>
            </ol>
        </nav>

        <div class="edit-card card shadow-sm">
            <div class="card-header bg-primary">
                <h5 class="mb-0">
                    <i class="fas fa-shield-alt me-2"></i>Редактирование объявления (Админ-панель)
                </h5>
            </div>
            <div class="card-body">
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Информация:</strong> Редактирование объявления от имени администратора.
                </div>

                <!-- ===== БЛОК ОШИБКИ ===== -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Ошибка:</strong>
                    <span th:text="${error}">Можно загрузить не более 5 фото</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                </div>

                <!-- ========== ФОРМА ДЛЯ ТОВАРОВ ========== -->
                <div th:if="${type == 'product'}">
                    <div th:each="el, iterStat : ${postwo}">
                        <th:block th:with="mapId='admin_product_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/admin_edit_user/' + ${el.hashId} + '/page_two/edit_admin'"
                              enctype="multipart/form-data"
                              th:id="'adminProductForm_' + ${el.id}">

                            <input type="hidden" name="userHashId" th:value="${hashId}"/>

                            <!-- ===== КАТЕГОРИЯ (только для чтения) ===== -->
                            <div th:replace="~{fragments/admin/edit/product/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>

                            <!-- ===== ХАРАКТЕРИСТИКИ (сразу после категории) ===== -->

                            <!-- НЕДВИЖИМОСТЬ (realty) -->
                            <div th:if="${el.category == 'realty'}">
                                <div th:replace="~{fragments/admin/edit/product/realty_fields :: realtyFields(el=${el})}"></div>
                            </div>

                            <!-- АВТОТРАНСПОРТ (motor) -->
                            <div th:if="${el.category == 'motor'}">
                                <div th:replace="~{fragments/admin/edit/product/motor_fields :: motorFields(el=${el})}"></div>
                            </div>

                            <!-- АВТОЗАПЧАСТИ (auto) -->
                            <div th:if="${el.category == 'auto'}">
                                <div th:replace="~{fragments/admin/edit/product/auto_fields :: autoFields(el=${el})}"></div>
                            </div>

                            <!-- СТРОИТЕЛЬНЫЕ МАТЕРИАЛЫ (constructions) -->
                            <div th:if="${el.category == 'constructions'}">
                                <div th:replace="~{fragments/admin/edit/product/constructions_fields :: constructionsFields(el=${el})}"></div>
                            </div>

                            <!-- ДОМ И ИНТЕРЬЕР (interior) -->
                            <div th:if="${el.category == 'interior'}">
                                <div th:replace="~{fragments/admin/edit/product/interior_fields :: interiorFields(el=${el})}"></div>
                            </div>

                            <!-- ИНСТРУМЕНТЫ (tools) -->
                            <div th:if="${el.category == 'tools'}">
                                <div th:replace="~{fragments/admin/edit/product/tools_fields :: toolsFields(el=${el})}"></div>
                            </div>

                            <!-- БЫТОВАЯ ТЕХНИКА (appliances) -->
                            <div th:if="${el.category == 'appliances'}">
                                <div th:replace="~{fragments/admin/edit/product/appliances_fields :: appliancesFields(el=${el})}"></div>
                            </div>

                            <!-- ЭЛЕКТРОНИКА (electronics) -->
                            <div th:if="${el.category == 'electronics'}">
                                <div th:replace="~{fragments/admin/edit/product/electronics_fields :: electronicsFields(el=${el})}"></div>
                            </div>

                            <!-- ОДЕЖДА И ОБУВЬ (clothing) -->
                            <div th:if="${el.category == 'clothing'}">
                                <div th:replace="~{fragments/admin/edit/product/clothing_fields :: clothingFields(el=${el})}"></div>
                            </div>

                            <!-- ДЕТСКИЕ ТОВАРЫ (childrenPr) -->
                            <div th:if="${el.category == 'childrenPr'}">
                                <div th:replace="~{fragments/admin/edit/product/children_fields :: childrenPrFields(el=${el})}"></div>
                            </div>

                            <!-- СПОРТИВНЫЕ ТОВАРЫ (sports) -->
                            <div th:if="${el.category == 'sports'}">
                                <div th:replace="~{fragments/admin/edit/product/sports_fields :: sportsFields(el=${el})}"></div>
                            </div>

                            <!-- ПРОДУКТЫ ПИТАНИЯ (food) -->
                            <div th:if="${el.category == 'food'}">
                                <div th:replace="~{fragments/admin/edit/product/food_fields :: foodFields(el=${el})}"></div>
                            </div>

                            <!-- ЗДОРОВЬЕ И КРАСОТА (health) -->
                            <div th:if="${el.category == 'health'}">
                                <div th:replace="~{fragments/admin/edit/product/health_fields :: healthFields(el=${el})}"></div>
                            </div>

                            <!-- ФЛОРА И ФАУНА (animals) -->
                            <div th:if="${el.category == 'animals'}">
                                <div th:replace="~{fragments/admin/edit/product/animals_fields :: animalsFields(el=${el})}"></div>
                            </div>

                            <!-- ===== ОБЩИЕ ПОЛЯ ===== -->
                            <div th:replace="~{fragments/admin/edit/product/common_fields :: title(el=${el})}"></div>
                            <div th:replace="~{fragments/admin/edit/product/common_fields :: price(el=${el})}"></div>
                            <div th:replace="~{fragments/admin/edit/product/common_fields :: description(el=${el})}"></div>

                            <!-- КАРТА С УНИКАЛЬНЫМ ID -->
                            <div th:replace="~{fragments/admin/edit/product/common_fields :: location(el=${el}, mapId=${mapId})}"></div>

                            <div th:replace="~{fragments/admin/edit/product/common_fields :: images(el=${el}, prefix='admin_product_' + ${el.id})}"></div>

                            <div th:replace="~{fragments/admin/premium_fields :: premiumBlock(el=${el}, entityId=${el.id})}"></div>
                            <div th:replace="~{fragments/admin/premium_fields :: donateBlock(el=${el}, entityId=${el.id})}"></div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div th:replace="~{fragments/admin/edit/product/common_fields :: submitButtons(hashId=${hashId})}"></div>
                        </form>
                    </div>
                </div>

                <!-- ========== ФОРМА ДЛЯ услуг ========== -->
                <div th:if="${type == 'service'}">
                    <div th:each="el, iterStat : ${postwo}">
                        <th:block th:with="mapId='admin_service_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/admin_edit_user/job/' + ${el.hashId} + '/page_two/edit_admin'"
                              enctype="multipart/form-data"
                              th:id="'adminServicetForm_' + ${el.id}">

                            <input type="hidden" name="userHashId" th:value="${hashId}"/>

                            <div th:replace="~{fragments/admin/edit/service/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>
                            <div th:replace="~{fragments/admin/edit/service/common_fields :: title(el=${el})}"></div>
                            <div th:replace="~{fragments/admin/edit/service/common_fields :: price(el=${el})}"></div>
                            <div th:replace="~{fragments/admin/edit/service/common_fields :: description(el=${el})}"></div>

                            <!-- КАРТА С УНИКАЛЬНЫМ ID -->
                            <div th:replace="~{fragments/admin/edit/service/common_fields :: location(el=${el}, mapId=${mapId})}"></div>

                            <div th:replace="~{fragments/admin/edit/service/common_fields :: images(el=${el}, prefix='admin_service_' + ${el.id})}"></div>

                            <div th:replace="~{fragments/admin/premium_fields :: premiumBlock(el=${el}, entityId=${el.id})}"></div>
                            <div th:replace="~{fragments/admin/premium_fields :: donateBlock(el=${el}, entityId=${el.id})}"></div>


                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div th:replace="~{fragments/admin/edit/service/common_fields :: submitButtons(hashId=${hashId})}"></div>
                        </form>
                    </div>
                </div>


                <!-- ========== ФОРМА ДЛЯ вакансии ========== -->
                <div th:if="${type == 'vacancy'}">
                    <div th:each="el, iterStat : ${vacvac}">
                        <th:block th:with="mapId='admin_vacancy_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/admin_edit_user/vac/' + ${el.hashId} + '/page_two/edit_admin'"
                              enctype="multipart/form-data"
                              th:id="'adminVacancyForm_' + ${el.id}">

                            <input type="hidden" name="userHashId" th:value="${hashId}"/>

                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>
                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: experience(el=${el}, experience=${experience})}"></div>
                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: workformat(el=${el}, workformat=${workformat})}"></div>
                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: title(el=${el})}"></div>
                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: salary(el=${el})}"></div>
                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: description(el=${el})}"></div>

                            <!-- КАРТА С УНИКАЛЬНЫМ ID -->
                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: location(el=${el}, mapId=${mapId})}"></div>

                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: images(el=${el}, prefix='admin_vacancy_' + ${el.id})}"></div>

                            <div th:replace="~{fragments/admin/premium_fields :: premiumBlock(el=${el}, entityId=${el.id})}"></div>
                            <div th:replace="~{fragments/admin/premium_fields :: donateBlock(el=${el}, entityId=${el.id})}"></div>


                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div th:replace="~{fragments/admin/edit/vacancy/common_fields :: submitButtons(hashId=${hashId})}"></div>
                        </form>
                    </div>
                </div>


                <!-- ========== ФОРМА ДЛЯ резюме ========== -->
                <div th:if="${type == 'resume'}">
                    <div th:each="el, iterStat : ${resume}">
                        <th:block th:with="mapId='admin_resume_' + ${iterStat.index} + '_' + ${el.id}" />

                        <form method="post"
                              th:action="'/page_two/admin_edit_user/res/' + ${el.hashId} + '/page_two/edit_admin'"
                              enctype="multipart/form-data"
                              th:id="'adminResumeForm_' + ${el.id}">

                            <input type="hidden" name="userHashId" th:value="${hashId}"/>

                            <!-- 1. Категория (readonly) -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: categoryReadonly(el=${el}, categories=${categories})}"></div>

                            <!-- 2. Название -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: title(el=${el})}"></div>

                            <!-- 3. Опыт работы -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: experience(el=${el}, experience=${experience})}"></div>

                            <!-- 4. Формат работы -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: workformat(el=${el}, workformat=${workformat})}"></div>

                            <!-- 5. Зарплата -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: salary(el=${el})}"></div>

                            <!-- 6. Место работы 1 -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: place1(el=${el})}"></div>

                            <!-- 7. Место работы 2 -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: place2(el=${el})}"></div>

                            <!-- Разделитель «Дополнительно» -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: divider}"></div>

                            <!-- 8.  навыки -->

                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: skills(el=${el})}"></div>

                            <!-- 9. О себе -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: description(el=${el})}"></div>

                            <!-- 10. Изображения -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: images(el=${el}, prefix='admin_resume_' + ${el.id})}"></div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <!-- 11. Кнопки -->
                            <div th:replace="~{fragments/admin/edit/resume/common_fields :: submitButtons(hashId=${hashId})}"></div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<footer th:insert="~{block/footer :: footerhtml}"></footer>

<!-- Подключаем универсальный скрипт для карт -->
<script type="text/javascript" th:src="@{/js/fragments/map_location_universal.js}"></script>
<script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/edit_admin_limit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-experience-edit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-workformat-edit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/filter/custom-filter-select.js}"></script>
<script type="text/javascript" th:src="@{/js/validate/validate_admin_edit_post.js}"></script>


<!-- Стили для админ-панели -->
<style>
    .premium-block {
        background: rgba(255, 107, 53, 0.05);
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid rgba(255, 107, 53, 0.2);
    }
    .premium-checkbox:checked {
        background-color: #ff6b35;
        border-color: #ff6b35;
    }
    .premium-priority {
        margin-top: 8px;
    }
    .donate-block {
        background: rgba(108, 117, 125, 0.08);
        border-radius: 12px;
        padding: 12px 16px;
        border: 1px solid rgba(108, 117, 125, 0.2);
    }
    .donate-checkbox:checked {
        background-color: #ff6b35;
        border-color: #ff6b35;
    }
    .form-check-input:checked {
        background-color: #ff6b35;
        border-color: #ff6b35;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // ========================================
        // ОБРАБОТЧИК PREMIUM
        // ========================================
        const premiumCheckboxes = document.querySelectorAll('.premium-checkbox');
        premiumCheckboxes.forEach(checkbox => {
            const entityId = checkbox.id.replace('premium_checkbox_', '');
            const fields = document.getElementById('premium-fields-' + entityId);
            const hiddenPremium = document.getElementById('hidden_premium_' + entityId);
            const hiddenPriority = document.getElementById('hidden_priority_' + entityId);
            const priorityInput = fields ? fields.querySelector('.premium-priority') : null;

            const updatePremium = () => {
                const isChecked = checkbox.checked;
                if (fields) {
                    fields.style.display = isChecked ? 'block' : 'none';
                }
                if (hiddenPremium) {
                    hiddenPremium.value = isChecked ? 'true' : 'false';
                }
                if (!isChecked) {
                    if (hiddenPriority) {
                        hiddenPriority.value = '0';
                    }
                    if (priorityInput) {
                        priorityInput.value = '0';
                    }
                }
            };

            checkbox.addEventListener('change', updatePremium);
            updatePremium();

            if (priorityInput) {
                priorityInput.addEventListener('input', function() {
                    if (hiddenPriority) {
                        hiddenPriority.value = this.value;
                    }
                });
            }
        });

        // ========================================
        // ОБРАБОТЧИК DONATE
        // ========================================
        const donateCheckboxes = document.querySelectorAll('.donate-checkbox');
        donateCheckboxes.forEach(checkbox => {
            const entityId = checkbox.id.replace('donate_checkbox_', '');
            const hiddenDonate = document.getElementById('hidden_donate_' + entityId);

            const updateDonate = () => {
                if (hiddenDonate) {
                    hiddenDonate.value = checkbox.checked ? 'true' : 'false';
                }
            };

            checkbox.addEventListener('change', updateDonate);
            updateDonate();
        });

        // ========================================
        // ВАЛИДАЦИЯ ФАЙЛОВ
        // ========================================
        const fileInputs = document.querySelectorAll('input[type="file"][multiple]');
        const maxSizeMB = 20;
        const maxSizeBytes = maxSizeMB * 1024 * 1024;

        fileInputs.forEach(input => {
            input.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files.length > 5) {
                    alert('Можно загрузить не более 5 изображений');
                    this.value = '';
                    return;
                }
                for (let i = 0; i < files.length; i++) {
                    if (files[i].size > maxSizeBytes) {
                        alert(`Файл "${files[i].name}" слишком большой! Максимум ${maxSizeMB} MB`);
                        this.value = '';
                        return;
                    }
                }
            });
        });

        // ========================================
        // ИНИЦИАЛИЗАЦИЯ КАРТ
        // ========================================
        if (typeof reinitMaps === 'function') {
            setTimeout(function() {
                reinitMaps();
            }, 1000);
        }
    });
</script>

</body>
</html>
