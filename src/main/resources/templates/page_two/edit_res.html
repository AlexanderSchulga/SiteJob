<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
    <link rel="stylesheet" th:href="@{/css/styleedit.css}">
</head>
<body>
<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="container mt-4">
        <!-- Хлебные крошки -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/index}" class="text-decoration-none">
                        <i class="fas fa-home me-1"></i>Главная
                    </a>
                </li>
                <li class="breadcrumb-item">
                    <a th:href="@{/page_two/redactor}" class="text-decoration-none">
                        <i class="fas fa-edit me-1"></i>Мои объявления
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Редактирование резюме
                </li>
            </ol>
        </nav>

        <div class="edit-card card shadow-sm">
            <div class="card-header bg-primary">
                <h5 class="mb-0">
                    <i class="fas fa-pen me-2"></i>Редактирование резюме
                </h5>
            </div>
            <div class="card-body">
                <!-- Информационное сообщение -->
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Важно:</strong> Изменения и отмеченные для удаления изображения будут применены только после прохождения модерации.
                </div>

                <!-- ===== БЛОК ОШИБКИ ===== -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <strong>Ошибка:</strong>
                    <span th:text="${error}">Можно загрузить не более 5 фото</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Закрыть"></button>
                </div>

                <!-- ========== ФОРМА ДЛЯ РЕЗЮМЕ ========== -->
                <div th:if="${type == 'resume'}">
                    <div th:each="el : ${res}">
                        <form method="post" th:action="'/page_two/redactor/res/' + ${el.hashId} + '/page_two/edit_res'" enctype="multipart/form-data" id="resumeForm">
                            <div class="mb-4">
                                <label for="resume_title" class="form-label">
                                    <i class="fas fa-heading me-1 text-muted"></i>Название резюме <span class="text-danger">*</span>
                                </label>
                                <input type="text" id="resume_title" th:value="${el.title}" name="title" placeholder="Введите название" class="form-control" required>
                            </div>

                            <div class="mb-4">
                                <label for="resume_cash" class="form-label">
                                    <i class="fas fa-ruble-sign me-1 text-muted"></i>Оплата <span class="text-danger">*</span>
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">₽</span>
                                    <input type="number" id="resume_cash" th:value="${el.cash}" name="cash" placeholder="Укажите оплату" class="form-control" required min="0" step="1">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Категория резюме</label>
                                <input type="text" class="form-control"
                                       th:value="${categories.get(el.category)}" disabled>
                                <input type="hidden" name="category" th:value="${el.category}">
                                <div class="form-text text-muted">Категория не может быть изменена</div>
                            </div>

                            <div class="mb-4">
                                <label for="resume_experience" class="form-label">
                                    <i class="fas fa-briefcase me-1 text-muted"></i>Опыт работы <span class="text-danger">*</span>
                                </label>
                                <select id="resume_experience" name="experience" class="form-select" required>
                                    <option th:each="experience : ${experience}"
                                            th:if="${experience.key != 'all'}"
                                            th:value="${experience.key}"
                                            th:selected="${experience.key == el.experience}"
                                            th:text="${experience.value}">
                                    </option>
                                </select>
                            </div>


                            <div class="mb-4">
                                <label for="resume_workformat" class="form-label">
                                    <i class="fas fa-briefcase me-1 text-muted"></i>Формат работы <span class="text-danger">*</span>
                                </label>
                                <select id="resume_workformat" name="workformat" class="form-select" required>
                                    <option th:each="workformat : ${workformat}"
                                            th:if="${workformat.key != 'all'}"
                                            th:value="${workformat.key}"
                                            th:selected="${workformat.key == el.workformat}"
                                            th:text="${workformat.value}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="resume_full_text" class="form-label">
                                    <i class="fas fa-align-left me-1 text-muted"></i>Описание
                                </label>
                                <textarea id="resume_full_text" name="full_text" placeholder="Полное описание" class="form-control" rows="5" th:text="${el.full_text != null ? el.full_text : ''}"></textarea>
                                <div class="form-text">Опишите ваши навыки, обязанности и достижения.</div>
                            </div>

                            <!-- Блок текущих изображений -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">
                                    <i class="fas fa-images me-1 text-muted"></i>Изображения
                                </label>
                                <div th:if="${not #lists.isEmpty(el.images)}" class="row g-3 mb-3">
                                    <div th:each="image, stat : ${el.images}" class="col-6 col-md-4 col-lg-3">
                                        <div class="image-card position-relative border rounded p-2"
                                             th:classappend="${image.markedForDeletion} ? 'marked-for-deletion' : ''">
                                            <img th:src="${image.imagePath}" class="img-fluid rounded" style="height: 120px; width: 100%; object-fit: cover;">
                                            <div class="form-check mt-2">
                                                <input type="checkbox" name="deleteImages" th:value="${image.id}"
                                                       class="form-check-input" th:checked="${image.markedForDeletion}"
                                                       th:id="'resumeDeleteImg_' + ${stat.index}">
                                                <label class="form-check-label small" th:for="'resumeDeleteImg_' + ${stat.index}"
                                                       th:classappend="${image.markedForDeletion} ? 'text-danger fw-bold' : 'text-muted'">
                                                    <i class="fas fa-trash-alt me-1"></i>
                                                    <span th:if="${image.markedForDeletion}">Будет удалено</span>
                                                    <span th:unless="${image.markedForDeletion}">Удалить</span>
                                                </label>
                                            </div>
                                            <div th:if="${image.markedForDeletion}" class="small text-warning mt-1">
                                                <i class="fas fa-clock me-1"></i>После модерации
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div th:if="${#lists.isEmpty(el.images)}" class="alert alert-light mb-3">
                                    <i class="fas fa-info-circle me-2"></i>Нет загруженных изображений
                                </div>

                                <label for="resume_files" class="form-label mt-2">
                                    <i class="fas fa-plus-circle me-1 text-muted"></i>Добавить новые изображения
                                </label>
                                <input type="file" id="resume_files" name="files" class="form-control" multiple accept="image/*">
                                <div class="form-text">Можно выбрать несколько файлов. Максимум 5 изображений.</div>
                                <div class="small text-muted mt-1">
                                    <i class="fas fa-images me-1"></i>
                                    Всего изображений: <span th:text="${el.images.size()}">0</span>
                                </div>
                            </div>

                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="d-flex gap-3 mt-4">
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-save me-2"></i>Обновить и отправить на модерацию
                                </button>
                                <a th:href="@{/page_two/redactor}" class="btn btn-outline-secondary">
                                    <i class="fas fa-times me-2"></i>Отмена
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{block/footer :: footerhtml}"></footer>

<script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/editimagelimitres.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-edit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-experience-edit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-workformat-edit.js}"></script>

<script>
    // Валидация количества файлов
    document.addEventListener('DOMContentLoaded', function() {
        const resumeFiles = document.getElementById('resume_files');
        const maxSizeMB = 20;
        const maxSizeBytes = maxSizeMB * 1024 * 1024;

        if (resumeFiles) {
            resumeFiles.addEventListener('change', function(e) {
                const files = e.target.files;

                if (files.length > 5) {
                    alert('Можно загрузить не более 5 изображений');
                    e.target.value = '';
                    return;
                }

                for (let i = 0; i < files.length; i++) {
                    if (files[i].size > maxSizeBytes) {
                        alert(`Файл "${files[i].name}" слишком большой! Максимум ${maxSizeMB} MB`);
                        e.target.value = '';
                        return;
                    }
                }
            });
        }
    });

    // Адаптация для sticky-шапки
    document.addEventListener('DOMContentLoaded', function() {
        const header = document.querySelector('header');
        if (header && window.getComputedStyle(header).position === 'sticky') {
            document.body.classList.add('has-sticky-header');
        }
    });
</script>
</body>
</html>
