<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
    <link rel="stylesheet" th:href="@{/css/styleviewstwo.css}">

    <script>
        function loadYandexMaps() {
            return new Promise((resolve, reject) => {
                if (window.ymaps) {
                    resolve();
                    return;
                }
                const script = document.createElement('script');
                script.src = 'https://api-maps.yandex.ru/2.1/?apikey=a29aa5a3-6b5d-4e6e-a513-27f390d21ae1&lang=ru_RU';
                script.onload = () => ymaps.ready(resolve);
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
    </script>
</head>

<body>
<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="container mt-4">
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/index}" class="text-decoration-none">
                        <i class="fas fa-home me-1"></i>Главная
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Создание нового товара
                </li>
            </ol>
        </nav>


        <div class="create-form-card card shadow-sm">
            <div class="card-header bg-primary">
                <h5 class="mb-0">
                    <i class="fas fa-plus-circle me-2"></i>Создание нового товара
                </h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/page_two/viewstwo}" method="post" enctype="multipart/form-data">

                    <!-- ===== КАТЕГОРИЯ ===== -->
                    <div class="mb-4">
                        <label for="category" class="form-label">
                            <i class="fas fa-tag me-1 text-muted"></i>Категория товара <span class="text-danger">*</span>
                        </label>
                        <select id="category" name="category" class="form-select" required style="display: none;">
                            <option value="">Выберите категорию</option>
                            <option th:each="category : ${categories}"
                                    th:if="${category.key != 'all'}"
                                    th:value="${category.key}"
                                    th:text="${category.value}">
                            </option>
                        </select>
                    </div>

                    <!-- ===== ДИНАМИЧЕСКИЕ ПОЛЯ ===== -->
                    <div id="dynamicFields">
                        <!-- Блоки для подкатегорий (характеристики) — сразу после категории -->
                        <div th:replace="~{fragments/product/create/realty_fields :: realtyFields}"></div>
                        <div th:replace="~{fragments/product/create/motor_fields :: motorFields}"></div>
                        <div th:replace="~{fragments/product/create/auto_fields :: autoFields}"></div>
                        <div th:replace="~{fragments/product/create/constructions_fields :: constructionsFields}"></div>
                        <div th:replace="~{fragments/product/create/interior_fields :: interiorFields}"></div>
                        <div th:replace="~{fragments/product/create/tools_fields :: toolsFields}"></div>
                        <div th:replace="~{fragments/product/create/appliances_fields :: appliancesFields}"></div>
                        <div th:replace="~{fragments/product/create/electronics_fields :: electronicsFields}"></div>
                        <div th:replace="~{fragments/product/create/clothing_fields :: clothingFields}"></div>
                        <div th:replace="~{fragments/product/create/children_fields :: childrenPrFields}"></div>
                        <div th:replace="~{fragments/product/create/sports_fields :: sportsFields}"></div>
                        <div th:replace="~{fragments/product/create/food_fields :: foodFields}"></div>
                        <div th:replace="~{fragments/product/create/health_fields :: healthFields}"></div>
                        <div th:replace="~{fragments/product/create/animals_fields :: animalsFields}"></div>

                        <!-- Общие поля -->
                        <div th:replace="~{fragments/product/create/common_fields :: title}"></div>
                        <div th:replace="~{fragments/product/create/common_fields :: price}"></div>
                        <div th:replace="~{fragments/product/create/common_fields :: description}"></div>
                        <div th:replace="~{fragments/product/create/common_fields :: location(mapId='create')}"></div>
                        <div th:replace="~{fragments/product/create/common_fields :: images}"></div>
                    </div>

                    <input type="hidden" name="moderation" value="true">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus-circle me-2"></i>Добавить товар
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{block/footer :: footerhtml}"></footer>

<script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/map_location.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/imagelimit.js}"></script>
<script type="text/javascript" th:src="@{/js/subcategory_create.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-set.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/filter/custom-filter-select.js}"></script>
<script type="text/javascript" th:src="@{/js/validate/validate_create_post.js}"></script>

<script>
    function clearLocation() {
        const input = document.getElementById('locationInput');
        if (input) input.value = '';
    }

    // Валидация файлов
    document.getElementById('files').addEventListener('change', function(e) {
        const files = e.target.files;
        const maxSizeMB = 20;
        const maxSizeBytes = maxSizeMB * 1024 * 1024;

        if (files.length > 5) {
            alert('Можно загрузить не более 5 изображений');
            e.target.value = '';
            return;
        }

        for (let i = 0; i < files.length; i++) {
            if (files[i].size > maxSizeBytes) {
                alert(`Файл "${files[i].name}" слишком большой! Максимум ${maxSizeMB} MB`);
                e.target.value = '';
                return;
            }
        }
    });
</script>
</body>
</html>
