<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title}"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/stylebackground.css}">
    <link rel="stylesheet" th:href="@{/css/styleviewstwo.css}">

</head>

<body>

<div class="container-wrapper">
    <header th:insert="~{block/header :: headerhtml}"></header>

    <div class="container mt-4">
        <!-- Хлебные крошки -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item">
                    <a th:href="@{/index}" class="text-decoration-none">
                        <i class="fas fa-home me-1"></i>Главная
                    </a>
                </li>
                <li class="breadcrumb-item active" aria-current="page">
                    Создание нового резюме
                </li>
            </ol>
        </nav>

        <div class="create-form-card card shadow-sm">
            <div class="card-header bg-primary">
                <h5 class="mb-0">
                    <i class="fas fa-plus-circle me-2"></i>Создание нового резюме
                </h5>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form th:action="@{/page_two/viewstwores}" method="post" enctype="multipart/form-data">
                    <!-- Категория резюме -->
                    <div class="mb-4">
                        <label for="category" class="form-label">
                            <i class="fas fa-tag me-1 text-muted"></i>Категория резюме <span class="text-danger">*</span>
                        </label>
                        <select id="category" name="category" class="form-select" required style="display: none;">
                            <option value="">Выберите категорию</option>
                            <option th:each="category : ${categories}"
                                    th:if="${category.key != 'all'}"
                                    th:value="${category.key}"
                                    th:text="${category.value}">
                            </option>
                        </select>
                        <!-- Кастомный select будет создан здесь через JS -->
                    </div>

                    <!-- Название резюме -->
                    <div class="mb-4">
                        <label for="title" class="form-label">
                            <i class="fas fa-heading me-1 text-muted"></i>Название резюме <span class="text-danger">*</span>
                        </label>
                        <input type="text" id="title" name="title"
                               placeholder="Введите название резюме"
                               class="form-control" required>
                    </div>


                    <div class="mb-3">
                        <label for="experience" class="form-label">Опыт работы *</label>
                        <select id="experience" name="experience" class="form-select" required>
                            <option value="">Выберите опыт работы</option>
                            <option th:each="experience : ${experience}"
                                    th:if="${experience.key != 'all'}"
                                    th:value="${experience.key}"
                                    th:text="${experience.value}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="workformat" class="form-label">Формат работы *</label>
                        <select id="workformat" name="workformat" class="form-select" required>
                            <option value="">Выберите формат работы</option>
                            <option th:each="workformat : ${workformat}"
                                    th:if="${workformat.key != 'all'}"
                                    th:value="${workformat.key}"
                                    th:text="${workformat.value}">
                            </option>
                        </select>
                    </div>

                    <!-- зарплата -->
                    <div class="mb-4">
                        <label for="cash" class="form-label">
                            <i class="fas fa-ruble-sign me-1 text-muted"></i>Укажите зарплату <span class="text-danger">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">₽</span>
                            <input type="number"
                                   id="cash"
                                   name="cash"
                                   placeholder="Укажите зарплату (только цифры)"
                                   class="form-control"
                                   required
                                   min="0"
                                   step="1"
                                   oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                        </div>
                    </div>

                    <!-- ================= МЕСТО РАБОТЫ 1 ================= -->
                    <div class="mb-4">
                        <h6 class="text-muted mb-3">
                            <i class="fas fa-briefcase me-1"></i>Место работы 1
                        </h6>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="place1Start" class="form-label">Дата начала</label>
                                <input type="date" id="place1Start" name="place1Start" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="place1End" class="form-label">Дата окончания</label>
                                <input type="date" id="place1End" name="place1End" class="form-control">
                                <div class="form-text">Оставьте пустым, если работаете по настоящее время</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="place1" class="form-label">Наименование организации</label>
                            <input type="text" id="place1" name="place1" class="form-control"
                                   placeholder="Например: ООО «Ромашка»">
                        </div>

                        <div class="mb-3">
                            <label for="placeofwork1" class="form-label">Обязанности и достижения</label>
                            <textarea id="placeofwork1" name="placeofwork1" class="form-control" rows="4"
                                      placeholder="Опишите обязанности и достижения на этом месте работы"></textarea>
                        </div>
                    </div>

                    <!-- ================= МЕСТО РАБОТЫ 2 ================= -->
                    <div class="mb-4">
                        <h6 class="text-muted mb-3">
                            <i class="fas fa-briefcase me-1"></i>Место работы 2
                        </h6>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="place2Start" class="form-label">Дата начала</label>
                                <input type="date" id="place2Start" name="place2Start" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="place2End" class="form-label">Дата окончания</label>
                                <input type="date" id="place2End" name="place2End" class="form-control">
                                <div class="form-text">Оставьте пустым, если работаете по настоящее время</div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="place2" class="form-label">Наименование организации</label>
                            <input type="text" id="place2" name="place2" class="form-control"
                                   placeholder="Например: ООО «Василёк»">
                        </div>

                        <div class="mb-3">
                            <label for="placeofwork2" class="form-label">Обязанности и достижения</label>
                            <textarea id="placeofwork2" name="placeofwork2" class="form-control" rows="4"
                                      placeholder="Опишите обязанности и достижения на этом месте работы"></textarea>
                        </div>
                    </div>


                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1 m-0" style="border: none; border-top: 1px solid #dee2e6; opacity: 1;">
                        <span class="px-3 text-muted small text-uppercase fw-semibold" style="letter-spacing: .08em;">
        <i class="fas fa-plus-circle me-1"></i>Дополнительно
    </span>
                        <hr class="flex-grow-1 m-0" style="border: none; border-top: 1px solid #dee2e6; opacity: 1;">
                    </div>


                    <!-- ================= НАВЫКИ ================= -->
                    <div class="mb-4">
                        <h6 class="text-muted mb-3">
                            <i class="fas fa-star me-1"></i>Навыки и достижения
                        </h6>
                        <textarea id="skills" name="skills" class="form-control" rows="4"
                                  placeholder="Перечислите ключевые навыки и достижения"></textarea>
                    </div>

                    <!-- Описание резюме -->
                    <div class="mb-4">
                        <label for="full_text" class="form-label">
                            <i class="fas fa-align-left me-1 text-muted"></i>О себе
                        </label>
                        <textarea id="full_text" name="full_text"
                                  placeholder="Введите описание резюме (необязательно)"
                                  class="form-control" rows="5"></textarea>
                        <div class="form-text">Опишите свои навыки, опыт и ожидания от работы.</div>
                    </div>

                    <!-- Изображения -->
                    <div class="mb-4">
                        <label for="files" class="form-label">
                            <i class="fas fa-images me-1 text-muted"></i>Изображения <span class="text-danger">*</span>
                        </label>
                        <input type="file" name="files" id="files" class="form-control" multiple accept="image/*" required>
                        <div class="form-text">
                            <i class="fas fa-info-circle me-1"></i>Вы можете выбрать несколько изображений, удерживая Ctrl (или Cmd на Mac). Максимум 5 изображений
                        </div>
                    </div>

                    <input type="hidden" name="moderation" value="true">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-plus-circle me-2"></i>Добавить резюме
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{block/footer :: footerhtml}"></footer>

<script type="text/javascript" th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script type="text/javascript" th:src="@{/js/map_location.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/imagelimit.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-set.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/custom-select-experience-set.js}"></script>
<script type="text/javascript" th:src="@{/js/functions/menu_work_format-set.js}"></script>

<script>
    document.getElementById('files').addEventListener('change', function(e) {
        const files = e.target.files;
        const maxSizeMB = 20;
        const maxSizeBytes = maxSizeMB * 1024 * 1024;

        if (files.length > 5) {
            alert('Можно загрузить не более 5 изображений');
            e.target.value = '';
            return;
        }

        for (let i = 0; i < files.length; i++) {
            if (files[i].size > maxSizeBytes) {
                alert(`Файл "${files[i].name}" слишком большой! Максимум ${maxSizeMB} MB`);
                e.target.value = '';
                return;
            }
        }
    });

    // Адаптация для sticky-шапки
    document.addEventListener('DOMContentLoaded', function() {
        const header = document.querySelector('header');
        if (header && window.getComputedStyle(header).position === 'sticky') {
            document.body.classList.add('has-sticky-header');
        }
    });
</script>

</body>
</html>
